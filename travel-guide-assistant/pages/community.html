<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelMate — 旅行社区</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div id="root"></div>
  <script src="../shared/utils.js"></script>
  <script src="../shared/site-nav.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    function Icon({ children, size = 16 }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
    }
    const SparkleIcon = ({ size = 18 }) => <Icon size={size}><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063L2.365 12.481a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0Z" /></Icon>;
    const SunIcon = ({ size = 18 }) => <Icon size={size}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></Icon>;
    const MoonIcon = ({ size = 18 }) => <Icon size={size}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></Icon>;
    const SearchIcon = ({ size = 18 }) => <Icon size={size}><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></Icon>;
    const MessageIcon = ({ size = 15 }) => <Icon size={size}><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.5 9.5 0 0 1-4.2-1L3 21l1.3-4.1A8.1 8.1 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z" /></Icon>;
    const HeartIcon = ({ size = 15 }) => <Icon size={size}><path d="M20.8 8.7c0 5.4-8.8 10.3-8.8 10.3S3.2 14.1 3.2 8.7A4.5 4.5 0 0 1 12 6.5a4.5 4.5 0 0 1 8.8 2.2Z" /></Icon>;
    const ArrowRightIcon = ({ size = 14 }) => <Icon size={size}><path d="M5 12h14M12 5l7 7-7 7" /></Icon>;
    const PlusIcon = ({ size = 15 }) => <Icon size={size}><path d="M12 5v14M5 12h14" /></Icon>;

    const posts = [
      { id: "p1", type: "攻略", tag: "日本", title: "关西 7 天经典家庭线路攻略", text: "带老人小孩也能走得舒服的节奏，伏见稻荷、岚山、金阁寺和奈良喂鹿一次安排。", author: "旅行达人小王", time: "2 小时前", likes: 386, comments: 42, guideId: "g1" },
      { id: "p2", type: "问答", tag: "冰岛", title: "冬季去冰岛自驾，四驱车真的有必要吗？", text: "计划明年一月环岛 8 天，主要担心冰雪路况和极光团的衔接，欢迎有经验的朋友分享。", author: "小满要出发", time: "5 小时前", likes: 128, comments: 31, query: "冰岛冬季自驾 8 天需要注意什么？" },
      { id: "p3", type: "攻略", tag: "国内", title: "大理 4 天慢生活：环海骑行和小众咖啡店", text: "避开古城人流的一条轻松路线，适合第一次去大理、又不想把行程排太满的人。", author: "背包客阿明", time: "昨天", likes: 198, comments: 19, guideId: "g3" },
      { id: "p4", type: "讨论", tag: "预算", title: "你们旅行时最愿意把预算花在哪一项？", text: "我会优先升级交通和住宿位置，景点门票反而会挑精选。大家的取舍是什么？", author: "慢慢走", time: "昨天", likes: 76, comments: 54 }
    ];

    const topics = ["日本樱花季", "带娃旅行", "预算规划", "自驾安全", "小众目的地"];
    const filters = ["全部", "攻略", "问答", "讨论"];

    function Topbar() {
      const [theme, setTheme] = useState(() => document.documentElement.classList.contains("dark") ? "dark" : "light");
      const [mobileOpen, setMobileOpen] = useState(false);
      const toggleTheme = () => setTheme(window.TravelMate.utils.toggleTheme());
      const nav = [
        ["首页", "home.html"],
        ["目的地", "explore.html"],
        ["攻略", "guides.html"],
        ["社区", "community.html"]
      ];
      return (
        <header className="topbar">
          <div className="topbar-left">
            <a className="brand" href="home.html"><span className="brand-icon"><SparkleIcon /></span><span className="brand-text">TravelMate</span></a>
            <nav className="nav-links">{nav.map(([label, href]) => <a key={href} className={`nav-link ${href === "community.html" ? "active" : ""}`} href={href}>{label}</a>)}</nav>
          </div>
          <div className="topbar-right">
            <button className="icon-btn" title="切换主题" aria-label="切换主题" onClick={toggleTheme}>{theme === "dark" ? <SunIcon /> : <MoonIcon />}</button>
            <button className="icon-btn menu-btn" title="打开菜单" aria-label="打开菜单" onClick={() => setMobileOpen(!mobileOpen)}><Icon><path d="M4 6h16M4 12h16M4 18h16" /></Icon></button>
            <div className="avatar">旅</div>
          </div>
          {mobileOpen && <nav className="mobile-nav">{nav.map(([label, href]) => <a key={href} className={`mobile-nav-link ${href === "community.html" ? "active" : ""}`} href={href}>{label}</a>)}</nav>}
        </header>
      );
    }

    function PostCard({ post, liked, onLike }) {
      const openPost = () => {
        if (post.guideId) window.TravelMate.utils.go("guide-detail.html", { id: post.guideId });
        else if (post.query) window.TravelMate.utils.go("assistant.html", { query: post.query });
      };
      return (
        <article className="post-card" data-testid={`community-post-${post.id}`}>
          <div className="post-meta"><span className={`post-type type-${post.type}`}>{post.type}</span><span className="post-tag">{post.tag}</span><span className="post-time">{post.time}</span></div>
          <h2 className="post-title" onClick={openPost} role={post.guideId || post.query ? "link" : undefined}>{post.title}</h2>
          <p className="post-text">{post.text}</p>
          <div className="post-footer">
            <span className="post-author"><span className="author-avatar">{post.author.slice(0, 1)}</span>{post.author}</span>
            <div className="post-actions">
              <button className={`post-action ${liked ? "liked" : ""}`} onClick={() => onLike(post.id)} aria-label={liked ? "取消点赞" : "点赞"}><HeartIcon /> {post.likes + (liked ? 1 : 0)}</button>
              <span className="post-action"><MessageIcon /> {post.comments}</span>
              {post.guideId && <button className="read-link" onClick={openPost}>阅读 <ArrowRightIcon /></button>}
            </div>
          </div>
        </article>
      );
    }

    function App() {
      const [activeFilter, setActiveFilter] = useState("全部");
      const [query, setQuery] = useState("");
      const [liked, setLiked] = useState([]);
      useEffect(() => window.TravelMate.utils.initTheme(), []);
      const filteredPosts = useMemo(() => posts.filter((post) => {
        const matchesType = activeFilter === "全部" || post.type === activeFilter;
        const text = `${post.title} ${post.text} ${post.author} ${post.tag}`.toLowerCase();
        return matchesType && text.includes(query.trim().toLowerCase());
      }), [activeFilter, query]);
      const toggleLike = (id) => setLiked((items) => items.includes(id) ? items.filter((item) => item !== id) : [...items, id]);

      return (
        <div className="app">
          <Topbar />
          <main className="community-layout">
            <section className="community-head">
              <div><span className="eyebrow">TRAVEL COMMUNITY</span><h1>和正在出发的人聊聊</h1><p>分享真实经验，找到同路人，让每一份攻略都更有参考价值。</p></div>
              <button className="primary-btn" onClick={() => window.TravelMate.utils.go("auth.html")}><PlusIcon /> 发布攻略</button>
            </section>
            <div className="community-content">
              <section className="feed-column">
                <div className="feed-toolbar">
                  <div className="filter-tabs">{filters.map((filter) => <button key={filter} className={`filter-tab ${activeFilter === filter ? "active" : ""}`} onClick={() => setActiveFilter(filter)}>{filter}</button>)}</div>
                  <label className="community-search"><SearchIcon size={16} /><input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="搜索社区内容" /></label>
                </div>
                <div className="feed-list">
                  {filteredPosts.length ? filteredPosts.map((post) => <PostCard key={post.id} post={post} liked={liked.includes(post.id)} onLike={toggleLike} />) : <div className="empty-feed"><SearchIcon size={24} /><h2>没有找到相关内容</h2><p>换个关键词，或者直接让 AI 帮你规划行程。</p><button className="primary-btn" onClick={() => window.TravelMate.utils.go("assistant.html", { query })}>去问 AI <ArrowRightIcon /></button></div>}
                </div>
              </section>
              <aside className="community-sidebar">
                <section className="side-section"><div className="side-heading"><h2>热门话题</h2><span>本周</span></div><div className="topic-list">{topics.map((topic, index) => <button key={topic} className="topic-row" onClick={() => setQuery(topic)}><strong>{String(index + 1).padStart(2, "0")}</strong><span>#{topic}</span><ArrowRightIcon size={13} /></button>)}</div></section>
                <section className="side-section guide-entry"><span className="side-kicker">从经验到计划</span><h2>看一篇真实攻略，再让 AI 帮你排成行程。</h2><a href="guides.html">浏览攻略库 <ArrowRightIcon /></a></section>
              </aside>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);line-height:1.55}
    button,input{font:inherit}
    .app{min-height:100vh;background:var(--background)}
    .topbar{position:sticky;top:0;z-index:100;min-height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*4);padding:0 calc(var(--spacing)*8);background:var(--background);backdrop-filter:blur(8px)}
    .brand-icon{width:36px;height:36px;border-radius:calc(var(--radius) + 4px);display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground)}
    .brand-text{font-size:1.1rem;font-weight:700}
    .nav-links{display:flex;align-items:center;gap:calc(var(--spacing)*1.5)}
    .nav-link{padding:calc(var(--spacing)*2.5) calc(var(--spacing)*3.5);border-radius:var(--radius);color:var(--muted-foreground);text-decoration:none;font-size:.9rem}
    .nav-link:hover{background:var(--primary-soft);color:var(--primary)}
    .nav-link.active{color:var(--foreground);font-weight:600}
    .avatar,.author-avatar{display:grid;place-items:center;border-radius:50%;background:var(--primary);color:var(--primary-foreground);font-weight:700}
    .avatar{width:36px;height:36px;font-size:.82rem}
    .menu-btn{display:none}
    .mobile-nav{display:none}
    .community-layout{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*10) calc(var(--spacing)*8) calc(var(--spacing)*14)}
    .community-head{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--spacing)*6);padding-bottom:calc(var(--spacing)*8);border-bottom:1px solid var(--border)}
    .eyebrow,.side-kicker{font-size:.72rem;letter-spacing:.1em;color:var(--primary);font-weight:700}
    .community-head h1{font-size:2rem;line-height:1.25;margin:calc(var(--spacing)*2) 0;font-weight:700}
    .community-head p{color:var(--muted-foreground);font-size:.95rem}
    .primary-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:calc(var(--spacing)*2.5) calc(var(--spacing)*4.5);border:0;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-size:.86rem;font-weight:600;cursor:pointer;white-space:nowrap}
    .primary-btn:hover{opacity:.9}
    .community-content{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:calc(var(--spacing)*8);padding-top:calc(var(--spacing)*8)}
    .feed-toolbar{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*4);margin-bottom:calc(var(--spacing)*4)}
    .filter-tabs{display:flex;gap:calc(var(--spacing)*1.5)}
    .filter-tab{border:0;background:transparent;color:var(--muted-foreground);padding:calc(var(--spacing)*2) calc(var(--spacing)*3);border-radius:var(--radius);cursor:pointer;font-size:.86rem}
    .filter-tab:hover{color:var(--primary);background:var(--primary-soft)}
    .filter-tab.active{background:var(--primary);color:var(--primary-foreground);font-weight:600}
    .community-search{display:flex;align-items:center;gap:calc(var(--spacing)*2);padding:calc(var(--spacing)*2) calc(var(--spacing)*3);border:1px solid var(--input);border-radius:999px;color:var(--muted-foreground);min-width:180px}
    .community-search input{border:0;outline:0;background:transparent;color:var(--foreground);width:100%;font-size:.82rem}
    .feed-list{display:flex;flex-direction:column;gap:calc(var(--spacing)*3)}
    .post-card{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:calc(var(--spacing)*5);transition:border-color .2s}
    .post-card:hover{border-color:var(--ring)}
    .post-meta{display:flex;align-items:center;gap:calc(var(--spacing)*2);font-size:.76rem;color:var(--muted-foreground)}
    .post-type,.post-tag{padding:.25rem .6rem;border-radius:999px;background:var(--muted);font-weight:600}
    .post-type{color:var(--primary)}
    .post-time{margin-left:auto}
    .post-title{font-size:1.05rem;line-height:1.4;margin:calc(var(--spacing)*3) 0 calc(var(--spacing)*2);cursor:default}
    .post-title[role="link"]{cursor:pointer}
    .post-title[role="link"]:hover{color:var(--primary)}
    .post-text{color:var(--muted-foreground);font-size:.88rem;line-height:1.65}
    .post-footer{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*3);border-top:1px solid var(--border);margin-top:calc(var(--spacing)*4);padding-top:calc(var(--spacing)*3)}
    .post-author,.post-actions,.post-action,.read-link{display:inline-flex;align-items:center;gap:.35rem}
    .post-author{font-size:.78rem;color:var(--muted-foreground)}
    .author-avatar{width:24px;height:24px;font-size:.7rem}
    .post-actions{gap:calc(var(--spacing)*4);color:var(--muted-foreground);font-size:.76rem}
    .post-action,.read-link{border:0;background:transparent;color:inherit;cursor:pointer;font-size:.76rem}
    .post-action:hover,.post-action.liked,.read-link{color:var(--primary)}
    .read-link{font-weight:600}
    .community-sidebar{display:flex;flex-direction:column;gap:calc(var(--spacing)*5)}
    .side-section{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:calc(var(--spacing)*5)}
    .side-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:calc(var(--spacing)*3)}
    .side-heading h2,.guide-entry h2{font-size:1rem}
    .side-heading span{font-size:.72rem;color:var(--muted-foreground)}
    .topic-list{display:flex;flex-direction:column;gap:calc(var(--spacing)*1)}
    .topic-row{display:flex;align-items:center;gap:calc(var(--spacing)*2);border:0;border-bottom:1px solid var(--border);padding:calc(var(--spacing)*2.5) 0;background:transparent;color:var(--foreground);cursor:pointer;text-align:left}
    .topic-row:last-child{border-bottom:0}
    .topic-row strong{font-family:var(--font-mono);color:var(--muted-foreground);font-size:.74rem}
    .topic-row span{flex:1;font-size:.84rem}
    .topic-row:hover{color:var(--primary)}
    .guide-entry{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
    .guide-entry .side-kicker{color:var(--primary-foreground);opacity:.8}
    .guide-entry h2{font-size:1.1rem;line-height:1.5;margin:calc(var(--spacing)*3) 0 calc(var(--spacing)*5)}
    .guide-entry a{display:inline-flex;align-items:center;gap:.35rem;color:inherit;text-decoration:none;font-size:.82rem;font-weight:600}
    .guide-entry a:hover{text-decoration:underline}
    .empty-feed{display:flex;flex-direction:column;align-items:center;gap:calc(var(--spacing)*3);border:1px dashed var(--border);padding:calc(var(--spacing)*10) calc(var(--spacing)*4);text-align:center;color:var(--muted-foreground)}
    .empty-feed h2{font-size:1.05rem;color:var(--foreground)}
    .empty-feed p{font-size:.84rem}
    @media (max-width:900px){.community-content{grid-template-columns:1fr}.community-sidebar{display:grid;grid-template-columns:1fr 1fr}.community-layout{padding-left:calc(var(--spacing)*5);padding-right:calc(var(--spacing)*5)}}
    @media (max-width:680px){.topbar{padding:0 calc(var(--spacing)*4);flex-wrap:wrap}.nav-links{display:none}.menu-btn{display:grid}.mobile-nav{display:flex;flex-direction:column;width:100%;padding:calc(var(--spacing)*3) 0 calc(var(--spacing)*4)}.mobile-nav-link{padding:calc(var(--spacing)*3);border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--muted-foreground);text-decoration:none;margin-bottom:calc(var(--spacing)*2)}.mobile-nav-link.active{color:var(--primary);border-color:var(--ring)}.community-layout{padding:calc(var(--spacing)*7) calc(var(--spacing)*4) calc(var(--spacing)*10)}.community-head{align-items:flex-start;flex-direction:column;padding-bottom:calc(var(--spacing)*6)}.community-head h1{font-size:1.65rem}.community-head .primary-btn{width:100%}.community-content{padding-top:calc(var(--spacing)*5)}.feed-toolbar{align-items:stretch;flex-direction:column}.community-search{width:100%}.filter-tabs{overflow-x:auto}.community-sidebar{display:flex}.post-card{padding:calc(var(--spacing)*4)}.post-footer{align-items:flex-start;flex-direction:column}.post-actions{width:100%;justify-content:space-between}}
  </style>
</body>
</html>
