<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate — 预算计算器</title>
    <link rel="stylesheet" href="../shared/theme.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>


</head>
<body>
  <div id="root"></div>
  <script src="../shared/utils.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/site-nav.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ── SVG Icons ── */
    function SparkleIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>; }
    function SunIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>; }
    function MoonIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>; }
    function ArrowLeftIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>; }
    function PlaneIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>; }
    function BedIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>; }
    function UtensilsIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>; }
    function CarIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>; }
    function TicketIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>; }
    function ShoppingBagIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>; }
    function LandmarkIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>; }
    function SaveIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>; }
    function WandIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8 19 13"/><path d="M15 9h0"/><path d="M17.8 6.2 19 5"/><path d="m3 21 9-9"/><path d="M12.2 6.2 11 5"/></svg>; }

    const CATS = [
      { id: "flight", label: "机票", icon: <PlaneIcon size={14} />, color: "var(--chart-1)", placeholder: "如 3000" },
      { id: "stay", label: "住宿", icon: <BedIcon size={14} />, color: "var(--chart-2)", placeholder: "如 2400" },
      { id: "food", label: "餐饮", icon: <UtensilsIcon size={14} />, color: "var(--chart-3)", placeholder: "如 1400" },
      { id: "transport", label: "交通", icon: <CarIcon size={14} />, color: "var(--chart-4)", placeholder: "如 600" },
      { id: "ticket", label: "门票", icon: <TicketIcon size={14} />, color: "var(--chart-5)", placeholder: "如 500" },
      { id: "shopping", label: "购物", icon: <ShoppingBagIcon size={14} />, color: "#9c27b0", placeholder: "如 800" },
      { id: "other", label: "其他", icon: <LandmarkIcon size={14} />, color: "#607d8b", placeholder: "如 400" }
    ];

    const PRESETS = [
      { name: "京都 7 天", values: { flight: 3000, stay: 2400, food: 1400, transport: 600, ticket: 500, shopping: 800, other: 400 } },
      { name: "冰岛 8 天", values: { flight: 8000, stay: 7500, food: 3500, transport: 5000, ticket: 2500, shopping: 500, other: 500 } },
      { name: "大理 4 天", values: { flight: 800, stay: 900, food: 600, transport: 300, ticket: 300, shopping: 300, other: 200 } },
      { name: "巴厘岛 6 天", values: { flight: 2500, stay: 2200, food: 900, transport: 1200, ticket: 800, shopping: 600, other: 300 } }
    ];

    function Topbar() {
      const [theme, setThemeState] = useState(() => (document.documentElement.classList.contains("dark") ? "dark" : "light"));
      const toggleTheme = () => setThemeState(window.TravelMate.utils.toggleTheme());
      return (
        <header className="topbar">
          <div className="topbar-left">
            <a className="brand" href="home.html">
              <div className="brand-icon"><SparkleIcon size={18} /></div>
              <span className="brand-text">TravelMate</span>
            </a>
            <a className="back-link" href="home.html"><ArrowLeftIcon size={14} /> 返回首页</a>
          </div>
          <div className="topbar-right">
            <button className="icon-btn" title="切换主题" onClick={toggleTheme} aria-label="切换主题">
              {theme === "dark" ? <SunIcon size={18} /> : <MoonIcon size={18} />}
            </button>
            <div className="avatar">旅</div>
          </div>
        </header>
      );
    }

    function PageHead() {
      return (
        <div className="page-head">
          <h1>旅行预算计算器</h1>
          <p>分项填写预估花费，实时查看总额与占比分布</p>
        </div>
      );
    }

    function DonutChart({ items }) {
      const total = items.reduce((acc, it) => acc + it.value, 0) || 1;
      const R = 15.915; // 半周长（stroke-dasharray 基准 100）
      let acc = 0;
      const segments = items.map((it) => {
        const frac = it.value / total;
        const seg = { ...it, dash: frac * 100, offset: acc * 100 };
        acc += frac;
        return seg;
      });
      return (
        <svg className="donut" viewBox="0 0 42 42" role="img" aria-label="预算占比图">
          <circle cx="21" cy="21" r={R} fill="none" stroke="var(--border)" strokeWidth="6" />
          {segments.map((s) => (
            <circle
              key={s.id}
              cx="21" cy="21" r={R}
              fill="none"
              stroke={s.color}
              strokeWidth="6"
              strokeDasharray={`${s.dash} ${100 - s.dash}`}
              strokeDashoffset={25 - s.offset}
              strokeLinecap="butt"
            />
          ))}
          <text x="21" y="20" textAnchor="middle" className="donut-total">¥{(total).toLocaleString()}</text>
          <text x="21" y="27" textAnchor="middle" className="donut-label">总预算</text>
        </svg>
      );
    }

    function BarRow({ item, pct, maxPct }) {
      return (
        <div className="bar-row">
          <span className="bar-cat" style={{ color: item.color }}>{item.icon} {item.label}</span>
          <div className="bar-track">
            <div className="bar-fill" style={{ width: (pct / maxPct) * 100 + "%", background: item.color }}></div>
          </div>
          <span className="bar-val">¥{item.value.toLocaleString()}</span>
          <span className="bar-pct">{pct}%</span>
        </div>
      );
    }

    function App() {
      const [values, setValues] = useState({ flight: 3000, stay: 2400, food: 1400, transport: 600, ticket: 500, shopping: 800, other: 400 });

      const setVal = (id, raw) => {
        const n = parseFloat(raw) || 0;
        setValues((prev) => ({ ...prev, [id]: Math.max(0, n) }));
      };

      const applyPreset = (preset) => setValues({ ...preset.values });

      const items = CATS.map((c) => ({ ...c, value: values[c.id] || 0 }));
      const total = items.reduce((acc, it) => acc + it.value, 0);
      const maxPct = Math.max(...items.map((it) => Math.round((it.value / (total || 1)) * 100)), 1);

      const handleSave = () => {
        try {
          localStorage.setItem("travelmate-budget", JSON.stringify({ values, total, savedAt: Date.now() }));
          alert("预算已保存");
        } catch (e) { alert("保存失败"); }
      };

      return (
        <div className="app">
          <Topbar />
          <PageHead />
          <div className="budget-body">
            <div className="presets">
              <span className="presets-label">快捷填入</span>
              {PRESETS.map((p) => (
                <button key={p.name} className="preset-chip" onClick={() => applyPreset(p)}><WandIcon size={12} /> {p.name}</button>
              ))}
            </div>

            <div className="budget-layout">
              <section className="budget-form">
                <h2 className="panel-title">分项预算</h2>
                <div className="cat-inputs">
                  {CATS.map((c) => (
                    <div key={c.id} className="cat-input">
                      <span className="cat-ico" style={{ background: c.color + "1a", color: c.color }}>{c.icon}</span>
                      <label htmlFor={`in-${c.id}`}>{c.label}</label>
                      <div className="money-input">
                        <span>¥</span>
                        <input
                          id={`in-${c.id}`}
                          type="number"
                          min="0"
                          step="50"
                          placeholder={c.placeholder}
                          value={values[c.id] || ""}
                          onChange={(e) => setVal(c.id, e.target.value)}
                        />
                      </div>
                    </div>
                  ))}
                </div>
                <button className="save-btn" onClick={handleSave}><SaveIcon size={14} /> 保存预算</button>
              </section>

              <section className="budget-viz">
                <h2 className="panel-title">占比分析</h2>
                <div className="donut-wrap">
                  <DonutChart items={items} />
                  <div className="donut-legend">
                    {items.map((it) => (
                      <div key={it.id} className="legend-row">
                        <span className="legend-dot" style={{ background: it.color }}></span>
                        <span className="legend-label">{it.label}</span>
                        <span className="legend-val">¥{it.value.toLocaleString()}</span>
                        <span className="legend-pct">{Math.round((it.value / (total || 1)) * 100)}%</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="bars">
                  {items.map((it) => (
                    <BarRow key={it.id} item={it} pct={Math.round((it.value / (total || 1)) * 100)} maxPct={maxPct} />
                  ))}
                </div>
              </section>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);letter-spacing:var(--tracking-normal);line-height:1.55}
    button,input{font:inherit}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:100;height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*4);padding:0 calc(var(--spacing)*8);background:var(--background);backdrop-filter:blur(8px)}
    .brand-icon{width:36px;height:36px;border-radius:calc(var(--radius) + 4px);display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground);font-weight:700}
    .brand-text{font-size:1.1rem;font-weight:700;letter-spacing:-0.01em}
    .back-link{display:inline-flex;align-items:center;gap:.35rem;color:var(--muted-foreground);text-decoration:none;font-size:.86rem;transition:color .2s}
    .back-link:hover{color:var(--primary)}

    /* Page Head */
    .page-head{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*7) calc(var(--spacing)*8) calc(var(--spacing)*4);display:flex;flex-direction:column;gap:calc(var(--spacing)*2)}
    .page-head h1{font-size:1.9rem;font-weight:700;letter-spacing:-0.02em}
    .page-head p{color:var(--muted-foreground);font-size:.92rem}

    /* Body */
    .budget-body{max-width:1200px;margin:0 auto;padding:0 calc(var(--spacing)*8) calc(var(--spacing)*10);display:flex;flex-direction:column;gap:calc(var(--spacing)*5)}

    /* Presets */
    .presets{display:flex;align-items:center;gap:calc(var(--spacing)*2.5);flex-wrap:wrap}
    .presets-label{font-size:.82rem;font-weight:600;color:var(--muted-foreground)}
    .preset-chip{display:inline-flex;align-items:center;gap:.4rem;padding:calc(var(--spacing)*2) calc(var(--spacing)*3);border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--foreground);font-size:.8rem;cursor:pointer;transition:all .2s}
    .preset-chip:hover{border-color:var(--primary);color:var(--primary)}
    .preset-chip svg{color:var(--primary)}

    /* Layout */
    .budget-layout{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--spacing)*6);align-items:start}

    /* Panels */
    .budget-form,.budget-viz{display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}
    .panel-title{font-size:1.1rem;font-weight:700;padding-bottom:calc(var(--spacing)*2.5);border-bottom:1px solid var(--border)}

    /* Cat Inputs */
    .cat-inputs{display:flex;flex-direction:column;gap:calc(var(--spacing)*2.5)}
    .cat-input{display:flex;align-items:center;gap:calc(var(--spacing)*3)}
    .cat-ico{width:34px;height:34px;flex:0 0 34px;border-radius:var(--radius);display:grid;place-items:center}
    .cat-input label{flex:1;font-size:.86rem;font-weight:600}
    .money-input{display:flex;align-items:center;gap:.3rem;width:150px;height:36px;padding:0 calc(var(--spacing)*3);border:1px solid var(--input);border-radius:var(--radius);background:var(--card);transition:border-color .2s}
    .money-input:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px rgba(66,133,244,.12)}
    .money-input span{color:var(--muted-foreground);font-size:.84rem}
    .money-input input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--foreground);font-size:.88rem;text-align:right}
    .money-input input::-webkit-outer-spin-button,.money-input input::-webkit-inner-spin-button{-webkit-appearance:none}
    .save-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;align-self:flex-start;margin-top:calc(var(--spacing)*2);padding:calc(var(--spacing)*2.5) calc(var(--spacing)*4.5);border:none;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:.86rem;cursor:pointer;transition:opacity .2s}
    .save-btn:hover{opacity:.9}

    /* Viz */
    .donut-wrap{display:flex;align-items:center;gap:calc(var(--spacing)*5);padding:calc(var(--spacing)*3);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card)}
    .donut{width:150px;height:150px;flex:0 0 150px}
    .donut-total{font-size:4px;font-weight:700;fill:var(--foreground)}
    .donut-label{font-size:2.6px;fill:var(--muted-foreground)}
    .donut-legend{flex:1;display:flex;flex-direction:column;gap:calc(var(--spacing)*1.8)}
    .legend-row{display:flex;align-items:center;gap:.5rem;font-size:.78rem}
    .legend-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%}
    .legend-label{flex:1;color:var(--muted-foreground)}
    .legend-val{font-family:var(--font-mono);font-size:.74rem}
    .legend-pct{width:36px;text-align:right;color:var(--muted-foreground);font-size:.74rem}

    /* Bars */
    .bars{display:flex;flex-direction:column;gap:calc(var(--spacing)*2.5)}
    .bar-row{display:flex;align-items:center;gap:calc(var(--spacing)*3)}
    .bar-cat{flex:0 0 64px;display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;font-weight:600}
    .bar-track{flex:1;height:8px;border-radius:999px;background:var(--muted);overflow:hidden}
    .bar-fill{height:100%;border-radius:999px;transition:width .3s}
    .bar-val{flex:0 0 72px;text-align:right;font-family:var(--font-mono);font-size:.76rem}
    .bar-pct{flex:0 0 36px;text-align:right;font-size:.74rem;color:var(--muted-foreground)}

    /* Responsive */
    @media (max-width:1024px){
      .budget-layout{grid-template-columns:1fr}
      .budget-body{padding-left:calc(var(--spacing)*5);padding-right:calc(var(--spacing)*5)}
    }
    @media (max-width:768px){
      .topbar{padding:0 calc(var(--spacing)*4)}
      .back-link{display:none}
      .page-head{padding:calc(var(--spacing)*6) calc(var(--spacing)*4) calc(var(--spacing)*3)}
      .budget-body{padding:0 calc(var(--spacing)*4) calc(var(--spacing)*8)}
      .donut-wrap{flex-direction:column;align-items:center}
      .donut-legend{width:100%}
    }
  </style>
</body>
</html>
