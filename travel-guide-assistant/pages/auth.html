<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate — 登录 / 注册</title>
    <link rel="stylesheet" href="../shared/theme.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>


</head>
<body>
  <div id="root"></div>
  <script src="../shared/utils.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/site-nav.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ── SVG Icons ── */
    function SparkleIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>; }
    function SunIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>; }
    function MoonIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>; }
    function MailIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>; }
    function LockIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>; }
    function UserIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>; }
    function KeyIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>; }
    function ShieldIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>; }
    function ArrowLeftIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>; }
    function CheckIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>; }
    function MapPinIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>; }
    function WandIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8 19 13"/><path d="M15 9h0"/><path d="M17.8 6.2 19 5"/><path d="m3 21 9-9"/><path d="M12.2 6.2 11 5"/></svg>; }
    function PlaneIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>; }

    /* ── 表单字段组件 ── */
    function Field({ label, icon, type = "text", placeholder, value, onChange, error, suffix }) {
      return (
        <div className="field">
          <label className="field-label">{label}</label>
          <div className={`field-box ${error ? "invalid" : ""}`}>
            <span className="field-icon">{icon}</span>
            <input
              type={type}
              placeholder={placeholder}
              value={value}
              onChange={(e) => onChange(e.target.value)}
            />
            {suffix}
          </div>
          {error && <span className="field-error">{error}</span>}
        </div>
      );
    }

    function BrandPanel() {
      return (
        <div className="brand-panel">
          <div className="brand-glow"></div>
          <div className="brand-panel-inner">
            <div className="brand-logo-row">
              <div className="brand-logo"><SparkleIcon size={20} /></div>
              <span className="brand-logo-text">TravelMate</span>
            </div>
            <div className="brand-quote">
              <h2>让每一次旅行<br />都有<span>完美攻略</span></h2>
              <p>基于真实攻略知识库的 AI 旅行助手，从灵感到行程，一站搞定</p>
            </div>
            <div className="brand-points">
              <div className="brand-point">
                <div className="point-icon"><WandIcon size={16} /></div>
                <div><strong>AI 智能规划</strong><span>描述想法，秒出个性化行程</span></div>
              </div>
              <div className="brand-point">
                <div className="point-icon"><PlaneIcon size={16} /></div>
                <div><strong>真实攻略背书</strong><span>回答标注知识库引用来源</span></div>
              </div>
              <div className="brand-point">
                <div className="point-icon"><MapPinIcon size={16} /></div>
                <div><strong>多目的地覆盖</strong><span>日本、冰岛、大理、巴厘岛…</span></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function AuthForm({ mode, onSwitch }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirm, setConfirm] = useState("");
      const [code, setCode] = useState("");
      const [nickname, setNickname] = useState("");
      const [agree, setAgree] = useState(false);
      const [errors, setErrors] = useState({});
      const [sendingCode, setSendingCode] = useState(false);
      const [countdown, setCountdown] = useState(0);
      const [showPwd, setShowPwd] = useState(false);

      useEffect(() => {
        if (countdown <= 0) return;
        const t = setTimeout(() => setCountdown((c) => c - 1), 1000);
        return () => clearTimeout(t);
      }, [countdown]);

      const sendCode = () => {
        if (!email.trim() || !/.+@.+\..+/.test(email)) {
          setErrors((e) => ({ ...e, email: "请输入有效的邮箱地址" }));
          return;
        }
        setErrors((e) => ({ ...e, email: undefined }));
        setSendingCode(true);
        setTimeout(() => { setSendingCode(false); setCountdown(60); }, 500);
      };

      const validate = () => {
        const errs = {};
        if (!email.trim() || !/.+@.+\..+/.test(email)) errs.email = "请输入有效的邮箱地址";
        if (!password || password.length < 6) errs.password = "密码至少 6 位";
        if (mode === "register") {
          if (!nickname.trim()) errs.nickname = "请输入昵称";
          if (password !== confirm) errs.confirm = "两次输入的密码不一致";
          if (!code.trim()) errs.code = "请输入验证码";
          if (!agree) errs.agree = "请先阅读并同意用户协议";
        }
        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validate()) return;
        const user = {
          name: mode === "register" ? nickname.trim() : email.split("@")[0],
          email: email.trim(),
          isGuest: false,
          joinedAt: new Date().toISOString()
        };
        window.TravelMate.utils.setSession(user);
        const redirect = window.TravelMate.utils.getQueryParam("redirect") || "profile.html";
        window.TravelMate.utils.go(redirect);
      };

      const handleGuest = () => {
        window.TravelMate.utils.makeGuest();
        const redirect = window.TravelMate.utils.getQueryParam("redirect") || "profile.html";
        window.TravelMate.utils.go(redirect);
      };

      const isLogin = mode === "login";

      return (
        <div className="auth-card">
          <div className="auth-tabs">
            <button className={`auth-tab ${isLogin ? "active" : ""}`} onClick={() => onSwitch("login")}>登录</button>
            <button className={`auth-tab ${!isLogin ? "active" : ""}`} onClick={() => onSwitch("register")}>注册</button>
          </div>
          <div className="auth-head">
            <h1>{isLogin ? "欢迎回来" : "创建账号"}</h1>
            <p>{isLogin ? "登录后同步你的行程与收藏" : "注册后开启你的专属旅行规划"}</p>
          </div>
          <form onSubmit={handleSubmit} className="auth-form">
            {!isLogin && (
              <Field label="昵称" icon={<UserIcon size={16} />} placeholder="你的昵称" value={nickname} onChange={setNickname} error={errors.nickname} />
            )}
            <Field label="邮箱" type="email" icon={<MailIcon size={16} />} placeholder="name@example.com" value={email} onChange={setEmail} error={errors.email} />
            {!isLogin && (
              <Field
                label="邮箱验证码"
                icon={<KeyIcon size={16} />}
                placeholder="6 位验证码"
                value={code}
                onChange={setCode}
                error={errors.code}
                suffix={
                  <button type="button" className="code-btn" onClick={sendCode} disabled={sendingCode || countdown > 0}>
                    {countdown > 0 ? `${countdown}s` : sendingCode ? "发送中..." : "获取验证码"}
                  </button>
                }
              />
            )}
            <Field
              label="密码"
              type={showPwd ? "text" : "password"}
              icon={<LockIcon size={16} />}
              placeholder="至少 6 位"
              value={password}
              onChange={setPassword}
              error={errors.password}
              suffix={
                <button type="button" className="eye-btn" onClick={() => setShowPwd(!showPwd)} aria-label="显示/隐藏密码">
                  {showPwd ? "隐藏" : "显示"}
                </button>
              }
            />
            {!isLogin && (
              <Field label="确认密码" type={showPwd ? "text" : "password"} icon={<LockIcon size={16} />} placeholder="再次输入密码" value={confirm} onChange={setConfirm} error={errors.confirm} />
            )}
            {isLogin && (
              <div className="form-row">
                <label className="checkbox-label">
                  <input type="checkbox" defaultChecked /> 记住我
                </label>
                <a className="link-text" href="auth.html?t=login">忘记密码？</a>
              </div>
            )}
            {!isLogin && (
              <label className="agree-row">
                <input type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} />
                <span>我已阅读并同意 <a className="link-text" href="home.html">《用户协议》</a> 和 <a className="link-text" href="home.html">《隐私政策》</a></span>
              </label>
            )}
            {errors.agree && <span className="field-error">{errors.agree}</span>}
            <button type="submit" className="submit-btn">{isLogin ? "登 录" : "注 册"}</button>
          </form>
          <div className="divider"><span>或</span></div>
          <button className="guest-btn" onClick={handleGuest}>
            <ShieldIcon size={16} /> 游客继续使用
          </button>
          <p className="auth-foot">
            {isLogin ? "还没有账号？" : "已有账号？"}
            <button className="link-btn" onClick={() => onSwitch(isLogin ? "register" : "login")}>
              {isLogin ? "立即注册" : "直接登录"}
            </button>
          </p>
        </div>
      );
    }

    function App() {
      const [mode, setMode] = useState("login");
      const [theme, setThemeState] = useState(() => (document.documentElement.classList.contains("dark") ? "dark" : "light"));

      useEffect(() => {
        window.TravelMate.utils.initTheme();
        const t = window.TravelMate.utils.getQueryParam("t");
        if (t === "register") setMode("register");
      }, []);

      const toggleTheme = () => setThemeState(window.TravelMate.utils.toggleTheme());

      return (
        <div className="auth-page">
          <button className="back-home" onClick={() => window.TravelMate.utils.go("home.html")}>
            <ArrowLeftIcon size={16} /> 返回首页
          </button>
          <button className="theme-toggle" onClick={toggleTheme} aria-label="切换主题">
            {theme === "dark" ? <SunIcon size={18} /> : <MoonIcon size={18} />}
          </button>
          <BrandPanel />
          <div className="auth-main">
            <AuthForm mode={mode} onSwitch={setMode} />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%}
    body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);letter-spacing:var(--tracking-normal);line-height:1.55}
    button,input{font:inherit}

    .auth-page{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:100vh;background:var(--background)}

    /* Floating controls */
    .back-home{position:absolute;top:calc(var(--spacing)*4);left:calc(var(--spacing)*4);z-index:20;display:inline-flex;align-items:center;gap:.4rem;padding:calc(var(--spacing)*2.5) calc(var(--spacing)*3.5);border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--foreground);cursor:pointer;font-size:.84rem;font-weight:600;transition:background .2s}
    .back-home:hover{background:var(--primary-soft)}
    .theme-toggle{position:absolute;top:calc(var(--spacing)*4);right:calc(var(--spacing)*4);z-index:20;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:var(--card);color:var(--foreground);cursor:pointer;transition:background .2s}
    .theme-toggle:hover{background:var(--primary-soft)}

    /* Brand Panel */
    .brand-panel{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(160deg,#1a73e8 0%,#4285f4 45%,#34a853 130%)}
    .brand-glow{position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 65%);top:-120px;right:-140px}
    .brand-panel-inner{position:relative;z-index:2;display:flex;flex-direction:column;gap:calc(var(--spacing)*8);padding:calc(var(--spacing)*10);max-width:480px;color:#fff}
    .brand-logo-row{display:flex;align-items:center;gap:calc(var(--spacing)*3)}
    .brand-logo{width:42px;height:42px;border-radius:var(--radius);display:grid;place-items:center;background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
    .brand-logo-text{font-size:1.3rem;font-weight:700;letter-spacing:-0.01em}
    .brand-quote h2{font-size:2.2rem;font-weight:700;line-height:1.3;letter-spacing:-0.02em;margin-bottom:calc(var(--spacing)*4)}
    .brand-quote h2 span{color:#ffd666}
    .brand-quote p{color:rgba(255,255,255,.85);font-size:.95rem;line-height:1.7;max-width:360px}
    .brand-points{display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}
    .brand-point{display:flex;align-items:flex-start;gap:calc(var(--spacing)*3.5)}
    .point-icon{width:36px;height:36px;flex:0 0 36px;border-radius:var(--radius);display:grid;place-items:center;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
    .brand-point strong{display:block;font-size:.92rem;margin-bottom:.15rem}
    .brand-point span{color:rgba(255,255,255,.78);font-size:.8rem}

    /* Auth Main */
    .auth-main{display:flex;align-items:center;justify-content:center;padding:calc(var(--spacing)*8)}
    .auth-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}
    .auth-tabs{display:flex;border-bottom:1px solid var(--border);gap:calc(var(--spacing)*4)}
    .auth-tab{padding:calc(var(--spacing)*3) 0;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted-foreground);font-size:.95rem;font-weight:600;cursor:pointer;transition:color .2s}
    .auth-tab.active{color:var(--primary);border-color:var(--primary)}
    .auth-head h1{font-size:1.6rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:calc(var(--spacing)*1.5)}
    .auth-head p{color:var(--muted-foreground);font-size:.88rem}
    .auth-form{display:flex;flex-direction:column;gap:calc(var(--spacing)*3.5)}
    .field{display:flex;flex-direction:column;gap:calc(var(--spacing)*1.5)}
    .field-label{font-size:.8rem;font-weight:600;color:var(--foreground)}
    .field-box{display:flex;align-items:center;gap:calc(var(--spacing)*3);padding:0 calc(var(--spacing)*3.5);height:44px;border:1px solid var(--input);border-radius:var(--radius);background:var(--popover);transition:border-color .2s,box-shadow .2s}
    .field-box:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px rgba(66,133,244,.12)}
    .field-box.invalid{border-color:var(--chart-2)}
    .field-icon{color:var(--muted-foreground);flex:0 0 auto;display:grid;place-items:center}
    .field-box input{flex:1;border:none;outline:none;background:transparent;color:var(--foreground);font-size:.88rem;min-width:0}
    .field-box input::placeholder{color:var(--muted-foreground)}
    .field-error{font-size:.74rem;color:var(--chart-2)}
    .code-btn{flex:0 0 auto;padding:calc(var(--spacing)*1.5) calc(var(--spacing)*2.5);border:none;border-radius:6px;background:var(--muted);color:var(--muted-foreground);font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap}
    .code-btn:disabled{opacity:.5;cursor:default}
    .eye-btn{flex:0 0 auto;border:none;background:transparent;color:var(--muted-foreground);font-size:.76rem;cursor:pointer;padding:calc(var(--spacing)*1)}
    .form-row{display:flex;justify-content:space-between;align-items:center}
    .checkbox-label{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--muted-foreground);cursor:pointer}
    .checkbox-label input,.agree-row input{accent-color:var(--primary)}
    .agree-row{display:flex;align-items:flex-start;gap:.45rem;font-size:.78rem;color:var(--muted-foreground);line-height:1.5;cursor:pointer}
    .agree-row input{margin-top:2px}
    .link-text{color:var(--primary);text-decoration:none}
    .link-text:hover{text-decoration:underline}
    .submit-btn{height:46px;border:none;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-size:.95rem;font-weight:700;letter-spacing:.2em;cursor:pointer;transition:opacity .2s;margin-top:calc(var(--spacing)*1)}
    .submit-btn:hover{opacity:.9}
    .divider{display:flex;align-items:center;gap:calc(var(--spacing)*3);color:var(--muted-foreground);font-size:.78rem}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
    .guest-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:44px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);font-size:.88rem;font-weight:600;cursor:pointer;transition:background .2s}
    .guest-btn:hover{background:var(--primary-soft)}
    .guest-btn svg{color:var(--primary)}
    .auth-foot{text-align:center;font-size:.84rem;color:var(--muted-foreground)}
    .link-btn{border:none;background:none;color:var(--primary);font-size:.84rem;font-weight:600;cursor:pointer;padding-left:.3rem}
    .link-btn:hover{text-decoration:underline}

    /* Responsive */
    @media (max-width:900px){
      .auth-page{grid-template-columns:1fr}
      .brand-panel{display:none}
      .auth-main{padding:calc(var(--spacing)*6) calc(var(--spacing)*5)}
    }
    @media (max-width:480px){
      .auth-main{padding:calc(var(--spacing)*5) calc(var(--spacing)*4)}
    }
  </style>
</body>
</html>
