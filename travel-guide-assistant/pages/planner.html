<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate — 行程规划器</title>
    <link rel="stylesheet" href="../shared/theme.css">



</head>
<body>
  <div id="root"></div>
  <script src="../shared/utils.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/trip-planner.js"></script>
  <script src="../shared/site-nav.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ── SVG Icons ── */
    function SparkleIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>; }
    function SunIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>; }
    function MoonIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>; }
    function ClockIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>; }
    function WalletIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>; }
    function PlusIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>; }
    function TrashIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>; }
    function GripIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>; }
    function ArrowLeftIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>; }
    function CheckIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>; }
    function MapPinIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>; }
    function BedIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>; }
    function UtensilsIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>; }
    function CarIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>; }
    function TicketIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>; }
    function SaveIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>; }
    function AlertIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>; }

    const CATEGORY_META = {
      other: { label: "活动", icon: <MapPinIcon size={12} />, color: "var(--muted-foreground)" },
      food: { label: "餐饮", icon: <UtensilsIcon size={12} />, color: "var(--chart-3)" },
      stay: { label: "住宿", icon: <BedIcon size={12} />, color: "var(--chart-1)" },
      transport: { label: "交通", icon: <CarIcon size={12} />, color: "var(--chart-2)" },
      ticket: { label: "门票", icon: <TicketIcon size={12} />, color: "var(--chart-5)" }
    };

    const DEFAULT_TRIP = {
      title: "京都 7 天自由行",
      destination: "京都 · 日本",
      days: 7,
      totalBudget: 12000,
      dayPlans: [
        { day: 1, title: "抵达京都 · 市区漫步", items: [
          { id: "d1a", time: "14:00", text: "关西机场 → 京都站 Haruka 特急", cat: "transport", budget: 160 },
          { id: "d1b", time: "17:00", text: "入住京都站附近酒店", cat: "stay", budget: 350 },
          { id: "d1c", time: "19:00", text: "鸭川漫步 + 先斗町晚餐", cat: "food", budget: 120 }
        ] },
        { day: 2, title: "伏见稻荷 · 清水寺", items: [
          { id: "d2a", time: "08:30", text: "伏见稻荷大社 千本鸟居", cat: "ticket", budget: 0 },
          { id: "d2b", time: "13:00", text: "清水寺 + 二年坂三年坂", cat: "ticket", budget: 30 },
          { id: "d2c", time: "18:30", text: "祇园晚餐 京料理", cat: "food", budget: 300 }
        ] },
        { day: 3, title: "岚山竹林 · 金阁寺", items: [
          { id: "d3a", time: "09:00", text: "岚山竹林小径", cat: "ticket", budget: 0 },
          { id: "d3b", time: "11:00", text: "嵯峨野小火车", cat: "ticket", budget: 110 },
          { id: "d3c", time: "15:00", text: "金阁寺 镜湖倒影", cat: "ticket", budget: 20 },
          { id: "d3d", time: "19:00", text: "锦市场小吃夜游", cat: "food", budget: 80 }
        ] },
        { day: 4, title: "奈良 · 与鹿共游", items: [
          { id: "d4a", time: "09:30", text: "近铁奈良 → 东大寺", cat: "transport", budget: 70 },
          { id: "d4b", time: "11:00", text: "奈良公园喂鹿", cat: "ticket", budget: 12 },
          { id: "d4c", time: "18:00", text: "奈良町晚餐", cat: "food", budget: 100 }
        ] },
        { day: 5, title: "大阪 · 城市漫游", items: [
          { id: "d5a", time: "09:00", text: "大阪城公园 天守阁", cat: "ticket", budget: 30 },
          { id: "d5b", time: "13:00", text: "道顿堀美食街", cat: "food", budget: 150 },
          { id: "d5c", time: "16:00", text: "心斋桥购物", cat: "ticket", budget: 0 }
        ] },
        { day: 6, title: "神户 · 异国风情", items: [
          { id: "d6a", time: "10:00", text: "北野异人馆", cat: "ticket", budget: 40 },
          { id: "d6b", time: "12:30", text: "神户牛肉午餐", cat: "food", budget: 400 },
          { id: "d6c", time: "17:00", text: "六甲山夜景", cat: "transport", budget: 90 }
        ] },
        { day: 7, title: "返程日", items: [
          { id: "d7a", time: "09:00", text: "临空城奥特莱斯补货", cat: "ticket", budget: 0 },
          { id: "d7b", time: "14:00", text: "前往关西机场", cat: "transport", budget: 160 }
        ] }
      ]
    };

    function loadTrip() {
      try {
        const raw = localStorage.getItem("travelmate-planner-draft");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.dayPlans) return parsed;
        }
      } catch (e) { /* ignore */ }
      return { ...JSON.parse(JSON.stringify(DEFAULT_TRIP)), isSample: true };
    }

    function Topbar({ onSave, saving }) {
      const [theme, setThemeState] = useState(() => (document.documentElement.classList.contains("dark") ? "dark" : "light"));
      const toggleTheme = () => setThemeState(window.TravelMate.utils.toggleTheme());
      return (
        <header className="topbar">
          <div className="topbar-left">
            <a className="brand" href="home.html">
              <div className="brand-icon"><SparkleIcon size={18} /></div>
              <span className="brand-text">TravelMate</span>
            </a>
            <a className="back-link" href="assistant.html"><ArrowLeftIcon size={14} /> 返回对话</a>
          </div>
          <div className="topbar-right">
            <button className="icon-btn" title="切换主题" onClick={toggleTheme} aria-label="切换主题">
              {theme === "dark" ? <SunIcon size={18} /> : <MoonIcon size={18} />}
            </button>
            <button className="save-btn" onClick={onSave} disabled={saving}><SaveIcon size={14} /> {saving ? "保存中..." : "保存行程"}</button>
          </div>
        </header>
      );
    }

    function PlannerHeader({ trip, total }) {
      const hasBudget = trip.totalBudget != null;
      const overBudget = hasBudget && total > trip.totalBudget;
      return (
        <div className="planner-head">
          <div className="planner-title-block">
            <h1>{trip.title}</h1>
            <div className="planner-meta">
              <span><MapPinIcon size={14} /> {trip.destination}</span>
              <span><ClockIcon size={14} /> {trip.days} 天</span>
              <span><WalletIcon size={14} /> {hasBudget ? "预算 ¥" + trip.totalBudget.toLocaleString() : "未设置行程总预算"}</span>
            </div>
          </div>
          <div className="planner-progress">
            <div className="progress-label">
              <span>已填估算 ¥{total.toLocaleString()}</span>
              <span className={overBudget ? "over" : ""}>{!hasBudget ? "" : overBudget ? "超支 ¥" + (total - trip.totalBudget).toLocaleString() : "剩余 ¥" + (trip.totalBudget - total).toLocaleString()}</span>
            </div>
            <div className="progress-track">
              <div className="progress-fill" style={{ width: Math.min(100, (trip.totalBudget > 0 ? (total / trip.totalBudget) * 100 : 0)) + "%" }}></div>
            </div>
          </div>
        </div>
      );
    }

    function DayTabs({ trip, activeDay, onSelect }) {
      return (
        <div className="day-tabs">
          {trip.dayPlans.map((d) => (
            <button key={d.day} className={`day-tab ${activeDay === d.day ? "active" : ""}`} onClick={() => onSelect(d.day)}>
              <span className="day-tab-num">D{d.day}</span>
              <span className="day-tab-title">{d.title.split(" ").slice(1).join(" ") || d.title}</span>
            </button>
          ))}
        </div>
      );
    }

    function ActivityItem({ item, index, count, onDrop, onDragStart, onDelete, onEdit }) {
      const meta = CATEGORY_META[item.cat] || CATEGORY_META.ticket;
      return (
        <div
          className="activity-item"
          draggable
          onDragStart={(e) => { e.dataTransfer.setData("text/plain", index + ""); onDragStart(); }}
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); const from = parseInt(e.dataTransfer.getData("text/plain"), 10); if (!isNaN(from)) onDrop(from, index); }}
        >
          <div className="activity-grip"><GripIcon size={13} /></div>
          <input className="form-input activity-time" aria-label={item.text + " 到达时间"} type="time" value={item.time || ""} onChange={(e) => onEdit(index, { time: e.target.value })} />
          <div className="activity-main">
            <input className="form-input activity-text" aria-label="活动名称" maxLength={500} value={item.text} onChange={(e) => onEdit(index, { text: e.target.value })} />
            <span className="activity-cat" style={{ background: meta.color + "1a", color: meta.color }}>{meta.icon} {meta.label}</span>
          </div>
          <div className="activity-budget">{item.budget == null ? "未估价" : "¥" + item.budget}</div>
          <div className="activity-reorder">
            <button type="button" aria-label={item.text + " 上移"} disabled={index === 0} onClick={() => onDrop(index, index - 1)}>↑</button>
            <button type="button" aria-label={item.text + " 下移"} disabled={index === count - 1} onClick={() => onDrop(index, index + 1)}>↓</button>
          </div>
          <button className="activity-delete" onClick={() => onDelete(index)} aria-label="删除"><TrashIcon size={13} /></button>
        </div>
      );
    }

    function DayPanel({ trip, activeDay, onDrop, onDragStart, onDelete, onAdd, onEdit }) {
      const day = trip.dayPlans.find((d) => d.day === activeDay) || trip.dayPlans[0];
      const [text, setText] = useState("");
      const [time, setTime] = useState("");
      const [cat, setCat] = useState("other");
      const [budget, setBudget] = useState("");
      const [showForm, setShowForm] = useState(false);

      const submitAdd = () => {
        if (!text.trim()) return;
        onAdd(day.day, { time, text: text.trim(), cat, budget: budget === "" ? null : Math.max(0, Number(budget)) });
        setText(""); setBudget(""); setShowForm(false);
      };

      return (
        <div className="day-panel">
          <div className="day-panel-head">
            <div>
              <span className="day-badge">D{day.day}</span>
              <h2>{day.title}</h2>
            </div>
            <button className="add-btn" onClick={() => setShowForm(!showForm)}><PlusIcon size={13} /> 添加安排</button>
          </div>

          {showForm && (
            <div className="add-form">
              <input className="form-input wide" aria-label="活动内容" maxLength={500} placeholder="活动内容，如：清水寺参拜" value={text} onChange={(e) => setText(e.target.value)} />
              <div className="form-row">
                <input className="form-input" type="time" aria-label="新活动到达时间" value={time} onChange={(e) => setTime(e.target.value)} />
                <select className="form-input" aria-label="活动类型" value={cat} onChange={(e) => setCat(e.target.value)}>
                  <option value="other">活动</option>
                  <option value="ticket">门票</option>
                  <option value="food">餐饮</option>
                  <option value="stay">住宿</option>
                  <option value="transport">交通</option>
                </select>
                <input className="form-input" type="number" min="0" aria-label="活动预算" placeholder="预算 ¥" value={budget} onChange={(e) => setBudget(e.target.value)} />
                <button className="primary-btn" onClick={submitAdd}><CheckIcon size={13} /> 添加</button>
              </div>
            </div>
          )}

          <div className="activity-list">
            {day.items.length === 0 && <div className="empty-day">这一天还没有安排，点击「添加安排」</div>}
            {day.items.map((item, i) => (
              <ActivityItem key={item.id} item={item} index={i} count={day.items.length} onDrop={onDrop} onDragStart={onDragStart} onDelete={onDelete} onEdit={onEdit} />
            ))}
          </div>
        </div>
      );
    }

    function BudgetSidebar({ trip }) {
      let grandTotal = 0;
      const rows = trip.dayPlans.map((d) => {
        const sum = window.TravelMate.planner.dayBudget(d) ?? 0;
        grandTotal += sum;
        return { day: d.day, title: d.title, sum };
      });
      return (
        <aside className="budget-sidebar">
          <h3 className="sidebar-title">预算追踪</h3>
          <div className="budget-total">
            <span>总预算</span>
            <strong>{trip.totalBudget == null ? "未设置" : "¥" + trip.totalBudget.toLocaleString()}</strong>
          </div>
          <div className="budget-rows">
            {rows.map((r) => (
              <div key={r.day} className="budget-row">
                <div className="budget-row-label">
                  <span className="mini-day">D{r.day}</span>
                  <span>{r.title.split(" ").slice(1).join(" ") || r.title}</span>
                </div>
                <span className="budget-row-val">¥{r.sum.toLocaleString()}</span>
              </div>
            ))}
          </div>
          <div className="budget-sum">
            <span>已填估算合计</span>
            <strong>¥{grandTotal.toLocaleString()}</strong>
          </div>
          <div className="sidebar-tip">
            <AlertIcon size={14} />
            <p>可用上下按钮或拖拽调整当天顺序。行程估算与官方日元门票分开显示。</p>
          </div>
        </aside>
      );
    }

    const REVIEW_ISSUES = {
      missing_schedule: "缺少日期或到达时间。",
      outside_admission: "计划到达时间不在公布的入场时段内。",
      closed: "当天为公布的休馆日。",
      source_stale: "资料已超过 180 天未复核，请查看官网。",
      outside_source_period: "出行日期不在这份资料的适用期内。",
      ticket_budget_exceeded: "已知门票小计超过门票预算。"
    };

    function TripReview({ trip, onChange }) {
      const [review, setReview] = useState(null);
      const [pending, setPending] = useState(false);
      const [error, setError] = useState("");
      const payload = window.TravelMate.planner.toApi(trip);
      const key = JSON.stringify(payload);
      const current = review && review.key === key ? review.data : null;
      const run = (event) => {
        event.preventDefault();
        if (trip.dayPlans.some((day) => day.items.some((item) => !item.text.trim()))) {
          setError("请填写活动名称，或删除空白活动后再检查。");
          return;
        }
        setPending(true); setError(""); setReview(null);
        window.TravelMate.api.checkTrip(payload, (data) => {
          setReview({ key, data }); setPending(false);
        }, () => {
          setError("暂时无法核验。请确认本地后端已启动，再试一次。"); setPending(false);
        });
      };
      return <section className="review-panel" aria-label="行程核验">
        <h2>出发前检查</h2>
        {trip.isSample && <p>这是关西示例行程；示例价格和时间不是实时信息。</p>}
        <p>按景点当地时间填日期和到达时间。目前支持大阪城天守阁（非公园）和金阁寺；不保证临时开放或有票。</p>
        <form onSubmit={run} className="review-form">
          <label>出发日期 <input className="form-input" type="date" value={trip.startDate || ""} onChange={(e) => onChange({ startDate: e.target.value })} /></label>
          <label>成人数 <input className="form-input" type="number" min="1" max="99" value={trip.adultCount ?? ""} onChange={(e) => onChange({ adultCount: e.target.value })} /></label>
          <label>全团门票预算（日元） <input className="form-input" type="number" min="0" max="100000000" value={trip.attractionCap ?? ""} onChange={(e) => onChange({ attractionCap: e.target.value })} /></label>
          <button className="primary-btn" type="submit" disabled={pending}>{pending ? "检查中…" : "检查行程"}</button>
          <button className="add-btn" type="button" onClick={() => window.print()}>打印全部行程 / 存 PDF</button>
        </form>
        {error && <p role="alert">{error}</p>}
        {review && !current && <p role="status">行程已改动，请重新检查。</p>}
        {current && <div role="status" className="review-results">
          <p>已知成人门票小计：{current.known_ticket_total_jpy == null ? "未计算" : current.known_ticket_total_jpy.toLocaleString() + " 日元"}；{current.unchecked_ticket_stops} 项门票或活动费用未核实。此小计不含交通及其他花费。</p>
          {current.issues.length > 0 && <ul>{current.issues.map((issue, i) => <li key={i}>{issue.day ? "第 " + issue.day + " 天 · " + issue.name + "：" : ""}{REVIEW_ISSUES[issue.code]}</li>)}</ul>}
          <ul>{current.stops.map((stop, i) => <li key={i}>第 {stop.day} 天{stop.date && "（" + stop.date + "）"} · {stop.name}：{stop.status === "within_published_hours" ? "在公布时段内" : stop.status === "conflict" ? "与公布时段冲突" : "待核实"} {stop.opens && <span className="stop-facts">公布开放 {stop.opens}–{stop.closes}{stop.last_admission && " · 最晚入场 " + stop.last_admission} · 成人 {stop.adult_ticket_jpy.toLocaleString()} 日元/人　</span>} {stop.source_url && <a href={stop.source_url} target="_blank" rel="noreferrer">官方资料（{stop.verified_on}）</a>} {stop.map_url && <a href={stop.map_url} target="_blank" rel="noreferrer">地图</a>}</li>)}</ul>
        </div>}
      </section>;
    }

    function PrintableTrip({ trip }) {
      return <div className="print-trip">
        <h1>{trip.title}</h1>
        <p>{trip.startDate ? "出发日期：" + trip.startDate : "出发日期未定"}{trip.isSample && " · 示例行程"}</p>
        {trip.dayPlans.map((day) => <section key={day.day}>
          <h2>第 {day.day} 天 · {day.title}</h2>
          {day.transport && <p>交通：{day.transport}</p>}
          <ol>{day.items.map((item) => <li key={item.id}>{item.time || "时间待定"} · {item.text}</li>)}</ol>
        </section>)}
        <p>开放、票价与交通可能变化，请出发前核对官方信息。</p>
      </div>;
    }

    function App() {
      const [trip, setTrip] = useState(loadTrip);
      const [activeDay, setActiveDay] = useState(1);
      const [saved, setSaved] = useState(false);
      const [tripId, setTripId] = useState(() => window.TravelMate.utils.getQueryParam("tripId"));
      const [loading, setLoading] = useState(() => Boolean(window.TravelMate.utils.getQueryParam("tripId")));
      const [saving, setSaving] = useState(false);
      const [loadError, setLoadError] = useState("");
      const [saveError, setSaveError] = useState("");

      useEffect(() => {
        window.TravelMate.utils.initTheme();
        const t = window.TravelMate.utils.getQueryParam("day");
        if (t) setActiveDay(parseInt(t, 10) || 1);
        const savedId = window.TravelMate.utils.getQueryParam("tripId");
        if (!savedId) return;
        window.TravelMate.api.getTrip(savedId, (savedTrip) => {
          const loadedTrip = window.TravelMate.planner.fromApi(savedTrip);
          setTrip(loadedTrip);
          setTripId(savedTrip.id);
          setActiveDay(loadedTrip.dayPlans[0] ? loadedTrip.dayPlans[0].day : 1);
          setLoading(false);
        }, (error) => {
          setLoading(false);
          setLoadError(error && error.message ? `读取行程失败：${error.message}` : "读取行程失败，请返回个人中心重试");
        });
      }, []);

      const moveItem = (dayIdx, from, to) => {
        if (from === to) return;
        setTrip((prev) => {
          const next = JSON.parse(JSON.stringify(prev));
          const day = next.dayPlans.find((d) => d.day === dayIdx);
          if (!day || from < 0 || to < 0 || from >= day.items.length || to >= day.items.length) return prev;
          const [moved] = day.items.splice(from, 1);
          day.items.splice(to, 0, moved);
          return next;
        });
      };

      const deleteItem = (dayIdx, index) => {
        setTrip((prev) => {
          const next = JSON.parse(JSON.stringify(prev));
          const day = next.dayPlans.find((d) => d.day === dayIdx);
          if (!day) return prev;
          day.items.splice(index, 1);
          return next;
        });
      };

      const addItem = (dayIdx, item) => {
        setTrip((prev) => {
          const next = JSON.parse(JSON.stringify(prev));
          const day = next.dayPlans.find((d) => d.day === dayIdx);
          if (!day) return prev;
          day.items.push({ id: "new" + Date.now(), ...item });
          return next;
        });
      };


      const editItem = (dayIdx, index, patch) => setTrip((previous) => ({
        ...previous, dayPlans: previous.dayPlans.map((day) => day.day !== dayIdx ? day : {
          ...day, items: day.items.map((item, i) => i === index ? { ...item, ...patch } : item)
        })
      }));

      const total = trip.dayPlans.reduce((sum, day) => sum + (window.TravelMate.planner.dayBudget(day) ?? 0), 0);

      const handleSave = () => {
        if (saving) return;
        if (trip.dayPlans.some((day) => day.items.some((item) => !item.text.trim()))) {
          setSaveError("请填写活动名称，或删除空白活动后再保存。");
          return;
        }
        setSaving(true);
        setSaveError("");
        const itinerary = window.TravelMate.planner.toApi(trip);
        const onOk = (savedTrip) => {
          setSaving(false);
          setTripId(savedTrip.id);
          if (!tripId) {
            const url = new URL(window.location.href);
            url.searchParams.set("tripId", savedTrip.id);
            window.history.replaceState(null, "", url);
          }
          localStorage.removeItem("travelmate-planner-draft");
          setSaved(true);
          setTimeout(() => setSaved(false), 2500);
        };
        const onError = (error) => {
          setSaving(false);
          setSaveError(error && error.message ? `保存失败：${error.message}` : "保存失败，请稍后重试");
        };
        if (tripId) {
          window.TravelMate.api.updateTrip(tripId, itinerary, onOk, onError);
        } else {
          window.TravelMate.api.saveTrip(itinerary, onOk, onError);
        }
      };

      if (loadError) {
        return <div className="app"><div className="page-state error" role="alert">{loadError} <button onClick={() => location.reload()}>重试</button> <a href="profile.html">返回个人中心</a></div></div>;
      }
      if (loading) {
        return <div className="app"><Topbar onSave={() => {}} saving /><div className="page-state">正在加载行程...</div></div>;
      }

      return (
        <div className="app">
          <Topbar onSave={handleSave} saving={saving} />
          {saveError && <div className="page-state error" role="alert">{saveError}<button className="ghost-btn" onClick={() => setSaveError("")}>知道了</button></div>}
          <PlannerHeader trip={trip} total={total} />
          <TripReview trip={trip} onChange={(patch) => setTrip((prev) => ({ ...prev, ...patch }))} />
          <PrintableTrip trip={trip} />
          <DayTabs trip={trip} activeDay={activeDay} onSelect={setActiveDay} />
          <div className="planner-layout">
            <main className="planner-main">
              {trip.dayPlans.length > 0 ? <DayPanel
                key={activeDay}
                trip={trip}
                activeDay={activeDay}
                onDrop={(from, to) => moveItem(activeDay, from, to)}
                onDragStart={() => {}}
                onDelete={(i) => deleteItem(activeDay, i)}
                onAdd={addItem}
                onEdit={(i, patch) => editItem(activeDay, i, patch)}
              /> : <p>这份行程还没有逐日安排。请返回助手生成一份新的行程。</p>}
            </main>
            <BudgetSidebar trip={trip} />
          </div>
          {saved && <div className="toast"><CheckIcon size={14} /> 行程已保存到个人中心</div>}
          <button className="floating-save" onClick={handleSave} disabled={saving}><SaveIcon size={15} /> {saving ? "保存中..." : tripId ? "更新行程" : "保存"}</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);letter-spacing:var(--tracking-normal);line-height:1.55}
    button,input,select{font:inherit}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:100;height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*4);padding:0 calc(var(--spacing)*8);background:var(--background);backdrop-filter:blur(8px)}
    .brand-icon{width:36px;height:36px;border-radius:calc(var(--radius) + 4px);display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground);font-weight:700}
    .brand-text{font-size:1.1rem;font-weight:700;letter-spacing:-0.01em}
    .back-link{display:inline-flex;align-items:center;gap:.35rem;color:var(--muted-foreground);text-decoration:none;font-size:.86rem;transition:color .2s}
    .back-link:hover{color:var(--primary)}
    .save-btn{display:inline-flex;align-items:center;gap:.4rem;padding:calc(var(--spacing)*2.5) calc(var(--spacing)*4);border:none;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:.86rem;cursor:pointer;transition:opacity .2s}
    .save-btn:hover{opacity:.9}

    /* Planner Head */
    .planner-head{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*6) calc(var(--spacing)*8) calc(var(--spacing)*4);display:flex;justify-content:space-between;align-items:flex-end;gap:calc(var(--spacing)*6);flex-wrap:wrap}
    .planner-title-block h1{font-size:1.5rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:calc(var(--spacing)*2)}
    .planner-meta{display:flex;gap:calc(var(--spacing)*4);flex-wrap:wrap;color:var(--muted-foreground);font-size:.82rem}
    .planner-meta span{display:inline-flex;align-items:center;gap:.35rem}
    .planner-progress{min-width:260px;flex:1;max-width:380px}
    .progress-label{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:calc(var(--spacing)*2);color:var(--muted-foreground)}
    .progress-label .over{color:var(--chart-2);font-weight:600}
    .progress-track{height:8px;border-radius:999px;background:var(--muted);overflow:hidden}
    .progress-fill{height:100%;border-radius:999px;background:var(--primary);transition:width .3s}

    /* Day Tabs */
    .day-tabs{max-width:1200px;margin:0 auto;padding:0 calc(var(--spacing)*8);display:flex;gap:calc(var(--spacing)*2);overflow-x:auto;border-bottom:1px solid var(--border);padding-bottom:0}
    .day-tab{display:flex;align-items:center;gap:.7rem;padding:calc(var(--spacing)*3) calc(var(--spacing)*3.5);border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted-foreground);cursor:pointer;white-space:nowrap;transition:color .2s}
    .day-tab:hover{color:var(--foreground)}
    .day-tab.active{color:var(--primary);border-color:var(--primary)}
    .day-tab-num{font-family:var(--font-mono);font-size:.72rem;font-weight:700;padding:.2rem .5rem;border-radius:6px;background:var(--muted)}
    .day-tab.active .day-tab-num{background:var(--primary);color:var(--primary-foreground)}
    .day-tab-title{font-size:.86rem;font-weight:600}

    /* Layout */
    .planner-layout{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*5) calc(var(--spacing)*8) calc(var(--spacing)*10);display:grid;grid-template-columns:1fr 300px;gap:calc(var(--spacing)*6);align-items:start}

    /* Day Panel */
    .day-panel{display:flex;flex-direction:column;gap:calc(var(--spacing)*4);min-width:0}
    .day-panel-head{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--spacing)*3);flex-wrap:wrap}
    .day-panel-head > div:first-child{display:flex;align-items:center;gap:calc(var(--spacing)*3.5)}
    .day-panel-head h2{font-size:1.15rem;font-weight:700}
    .day-badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 .4rem;border-radius:6px;background:var(--primary);color:var(--primary-foreground);font-weight:700;font-size:.72rem;font-family:var(--font-mono)}
    .add-btn{display:inline-flex;align-items:center;gap:.4rem;padding:calc(var(--spacing)*2) calc(var(--spacing)*3.5);border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);font-weight:600;font-size:.82rem;cursor:pointer;transition:background .2s}
    .add-btn:hover{background:var(--primary-soft)}

    /* Add Form */
    .add-form{display:flex;flex-direction:column;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*4);border:1px solid var(--ring);border-radius:var(--radius);background:var(--popover)}
    .form-input{height:36px;padding:0 calc(var(--spacing)*3);border:1px solid var(--input);border-radius:var(--radius);background:var(--card);color:var(--foreground);font-size:.84rem;outline:none;transition:border-color .2s}
    .form-input:focus{border-color:var(--ring)}
    .form-input.wide{width:100%}
    .form-row{display:flex;gap:calc(var(--spacing)*2);flex-wrap:wrap}
    .form-row .form-input{flex:1;min-width:90px}
    .primary-btn{display:inline-flex;align-items:center;gap:.4rem;padding:calc(var(--spacing)*2) calc(var(--spacing)*3.5);border:none;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:.82rem;cursor:pointer;transition:opacity .2s}
    .primary-btn:hover{opacity:.9}

    /* Activity List */
    .activity-list{display:flex;flex-direction:column;gap:calc(var(--spacing)*2.5)}
    .activity-item{display:flex;align-items:center;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*3) calc(var(--spacing)*3.5);border:1px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:grab;transition:border-color .2s}
    .activity-item:hover{border-color:var(--ring)}
    .activity-item:active{cursor:grabbing}
    .activity-grip{color:var(--muted-foreground);flex:0 0 auto;opacity:.5}
    .activity-time{flex:0 0 auto;font-family:var(--font-mono);font-size:.8rem;color:var(--muted-foreground);width:9rem;max-width:100%}
    .activity-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
    .activity-text{font-size:.88rem}
    .activity-cat{display:inline-flex;align-items:center;gap:.3rem;width:max-content;padding:.18rem .55rem;border-radius:999px;font-size:.7rem;font-weight:600}
    .activity-budget{flex:0 0 auto;font-family:var(--font-mono);font-size:.8rem;color:var(--foreground)}
    .activity-delete{flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;border:none;border-radius:var(--radius);background:transparent;color:var(--muted-foreground);cursor:pointer;transition:all .2s;opacity:0}
    .activity-item:hover .activity-delete{opacity:1}
    .activity-delete:hover{background:rgba(234,67,53,.1);color:var(--chart-2)}
    .empty-day{padding:calc(var(--spacing)*6);text-align:center;color:var(--muted-foreground);font-size:.86rem;border:1px dashed var(--border);border-radius:var(--radius)}

    /* Budget Sidebar */
    .budget-sidebar{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:calc(var(--spacing)*4);display:flex;flex-direction:column;gap:calc(var(--spacing)*3);position:sticky;top:84px}
    .sidebar-title{font-size:.95rem;font-weight:700;padding-bottom:calc(var(--spacing)*2);border-bottom:1px solid var(--border)}
    .budget-total,.budget-sum{display:flex;justify-content:space-between;align-items:center}
    .budget-total span,.budget-sum span{color:var(--muted-foreground);font-size:.84rem}
    .budget-total strong,.budget-sum strong{font-size:1.1rem}
    .budget-rows{display:flex;flex-direction:column;max-height:300px;overflow-y:auto}
    .budget-row{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--spacing)*2);padding:calc(var(--spacing)*2.2) 0;border-top:1px solid var(--border);font-size:.8rem}
    .budget-row:first-child{border-top:none}
    .budget-row-label{display:flex;align-items:center;gap:.5rem;min-width:0}
    .budget-row-label span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mini-day{flex:0 0 auto;font-family:var(--font-mono);font-size:.68rem;font-weight:700;color:var(--muted-foreground)}
    .budget-row-val{flex:0 0 auto;font-family:var(--font-mono);font-size:.78rem}
    .budget-sum{padding-top:calc(var(--spacing)*3);border-top:1px solid var(--border)}
    .sidebar-tip{display:flex;gap:.6rem;padding:calc(var(--spacing)*3);border-radius:var(--radius);background:var(--muted);font-size:.76rem;color:var(--muted-foreground);line-height:1.5}
    .sidebar-tip svg{flex:0 0 auto;color:var(--primary);margin-top:.1rem}

    /* Toast + Floating Save */
    .page-state{max-width:720px;margin:calc(var(--spacing)*8) auto;padding:calc(var(--spacing)*5);display:flex;align-items:center;justify-content:center;gap:calc(var(--spacing)*3);border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--muted-foreground);font-size:.9rem}
    .page-state.error{color:var(--chart-2);border-color:rgba(234,67,53,.35)}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:inline-flex;align-items:center;gap:.5rem;padding:calc(var(--spacing)*3) calc(var(--spacing)*5);border-radius:999px;background:var(--foreground);color:var(--background);font-size:.86rem;font-weight:600;box-shadow:0 4px 16px rgba(14,17,21,.15)}
    .toast svg{color:var(--chart-5)}
    .floating-save{position:fixed;right:24px;bottom:24px;z-index:200;display:inline-flex;align-items:center;gap:.45rem;padding:calc(var(--spacing)*3) calc(var(--spacing)*4.5);border:none;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:.86rem;cursor:pointer;transition:opacity .2s}
    .floating-save:hover{opacity:.9}
    .floating-save:disabled,.save-btn:disabled{opacity:.55;cursor:wait}

    /* Responsive */
    @media (max-width:1024px){
      .planner-layout{grid-template-columns:1fr;padding-left:calc(var(--spacing)*5);padding-right:calc(var(--spacing)*5)}
      .budget-sidebar{position:static}
    }
    @media (max-width:768px){
      .topbar{padding:0 calc(var(--spacing)*4)}
      .back-link{display:none}
      .planner-head{padding:calc(var(--spacing)*5) calc(var(--spacing)*4) calc(var(--spacing)*3)}
      .day-tabs{padding:0 calc(var(--spacing)*4)}
      .planner-layout{padding:calc(var(--spacing)*4)}
      .activity-item{flex-wrap:wrap}
      .activity-delete{opacity:1}
    }
      .review-panel{margin:1rem auto;padding:1rem;border:1px solid var(--border);border-radius:var(--radius);max-width:1200px}
    .review-panel h2{font-size:1.1rem;margin:0 0 .45rem}
    .review-panel p,.review-results li{font-size:.875rem;margin:.35rem 0}
    .review-form{display:flex;gap:.65rem;flex-wrap:wrap;align-items:end;margin-top:.8rem}
    .review-form label{display:grid;gap:.25rem;font-size:.8rem}
    .review-form input[type="number"]{width:10rem}
    .review-results a{text-decoration:underline}
    .stop-facts{display:block;color:var(--muted-foreground);font-size:.8rem}
    .activity-reorder{display:flex;gap:.15rem}
    .activity-reorder button{min-width:28px;min-height:32px}
    .activity-reorder button:disabled{opacity:.35}
    .print-trip{display:none}
    @media(max-width:620px){.activity-item{flex-wrap:wrap}.activity-main{min-width:9rem}.review-panel{margin:.75rem}}
    @media print{
      .app > :not(.print-trip){display:none!important}
      .print-trip{display:block;color:#000;background:#fff}
      .print-trip li{break-inside:avoid}
      html,body,.app{background:#fff!important;color:#000!important;overflow:visible!important}
    }
  </style>
</body>
