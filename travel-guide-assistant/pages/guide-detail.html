    .cover{width:100%;height:100%;object-fit:cover;display:block}
    .cover-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,17,21,.12) 0%,rgba(14,17,21,.78) 100%)}
    .cover-content{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--spacing)*7) calc(var(--spacing)*8);display:flex;flex-direction:column;gap:calc(var(--spacing)*3)}
    .head-tags{display:flex;gap:calc(var(--spacing)*2)}
    .head-tag{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff;font-size:.78rem;font-weight:600}
    .head-title{color:#fff;font-size:1.9rem;font-weight:700;letter-spacing:-0.02em;max-width:760px;line-height:1.3}
    .head-author{display:flex;align-items:center;gap:calc(var(--spacing)*3)}
    .author-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground);font-weight:700;font-size:.9rem}
    .author-info{display:flex;flex-direction:column;gap:.1rem}
    .author-info strong{color:#fff;font-size:.9rem}
    .author-info span{display:inline-flex;align-items:center;gap:.3rem;color:rgba(255,255,255,.8);font-size:.76rem}
    .head-actions{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*3) calc(var(--spacing)*8);display:flex;justify-content:space-between;align-items:center;gap:calc(var(--spacing)*3);flex-wrap:wrap}
    .head-stats{display:flex;gap:calc(var(--spacing)*5);color:var(--muted-foreground);font-size:.84rem}
    .head-stats span{display:inline-flex;align-items:center;gap:.35rem}
    .action-buttons{display:flex;gap:calc(var(--spacing)*2)}
    .ghost-btn{display:inline-flex;align-items:center;gap:.4rem;padding:calc(var(--spacing)*2.2) calc(var(--spacing)*3.5);border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);font-weight:600;font-size:.82rem;cursor:pointer;transition:all .2s}
    .ghost-btn:hover{background:var(--primary-soft)}
    .ghost-btn.active{border-color:var(--chart-2);color:var(--chart-2);background:rgba(234,67,53,.06)}
    .ghost-btn.active.saved{border-color:var(--chart-3);color:var(--chart-3);background:rgba(251,188,5,.08)}

    /* Detail Layout */
    .detail-layout{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*6) calc(var(--spacing)*8) calc(var(--spacing)*4);display:grid;grid-template-columns:1fr 320px;gap:calc(var(--spacing)*7);align-items:start}
    .detail-main{min-width:0;display:flex;flex-direction:column;gap:calc(var(--spacing)*6)}

    /* Summary */
    .summary-card{border-left:3px solid var(--primary);background:var(--popover);border-radius:0 var(--radius) var(--radius) 0;padding:calc(var(--spacing)*4) calc(var(--spacing)*5)}
    .summary-card p{font-size:.92rem;line-height:1.7;color:var(--foreground)}

    /* Sections */
    .content-section{display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}
    .section-title{display:flex;justify-content:space-between;align-items:center}
    .section-title h2{font-size:1.25rem;font-weight:700}
    .section-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border-radius:999px;background:var(--muted);color:var(--muted-foreground);font-size:.76rem;font-weight:600}

    /* Timeline */
    .timeline{display:flex;flex-direction:column}
    .timeline-item{display:flex;gap:calc(var(--spacing)*4)}
    .timeline-marker{display:flex;flex-direction:column;align-items:center;flex:0 0 16px}
    .marker-dot{width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid var(--background);box-shadow:0 0 0 1px var(--primary);margin-top:6px}
    .marker-line{flex:1;width:2px;background:var(--border);margin:calc(var(--spacing)*1) 0}
    .timeline-card{flex:1;padding-bottom:calc(var(--spacing)*5);min-width:0}
    .timeline-day{display:inline-block;padding:.25rem .7rem;border-radius:999px;background:var(--muted);color:var(--muted-foreground);font-weight:700;font-size:.74rem;font-family:var(--font-mono);margin-bottom:calc(var(--spacing)*2)}
    .timeline-title{font-size:1rem;font-weight:700;margin-bottom:calc(var(--spacing)*2)}
    .timeline-items{list-style:none;display:flex;flex-direction:column;gap:calc(var(--spacing)*2)}
    .timeline-items li{position:relative;padding-left:calc(var(--spacing)*3);font-size:.86rem;color:var(--muted-foreground);line-height:1.6}
    .timeline-items li::before{content:"•";position:absolute;left:0;color:var(--primary)}

    /* Budget */
    .budget-table{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);overflow:hidden}
    .budget-row{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*3) calc(var(--spacing)*4);border-top:1px solid var(--border);font-size:.88rem}
    .budget-row:first-child{border-top:none}
    .budget-row span{color:var(--muted-foreground)}
    .budget-row.total{background:var(--muted);border-top:2px solid var(--primary)}
    .budget-row.total span,.budget-row.total strong{color:var(--muted-foreground);font-weight:700}

    /* Tips */
    .tips-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--spacing)*3)}
    .tip-card{display:flex;gap:calc(var(--spacing)*3);align-items:flex-start;padding:calc(var(--spacing)*3.5);border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
    .tip-num{flex:0 0 auto;font-family:var(--font-mono);font-size:.95rem;font-weight:700;color:var(--primary);opacity:.4}
    .tip-card p{font-size:.84rem;line-height:1.55;color:var(--foreground)}

    /* Comments */
    .comment-input-row{display:flex;gap:calc(var(--spacing)*3);align-items:center}
    .comment-input-box{flex:1;display:flex;align-items:center;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*2.8) calc(var(--spacing)*3.5);border:1px solid var(--input);border-radius:999px;background:var(--popover);transition:border-color .2s,box-shadow .2s}
    .comment-input-box:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px rgba(66,133,244,.12)}
    .comment-input-box svg{color:var(--muted-foreground);flex:0 0 auto}
    .comment-input-box input{flex:1;border:none;outline:none;background:transparent;color:var(--foreground);font-size:.88rem}
    .comment-input-box input::placeholder{color:var(--muted-foreground)}
    .primary-btn{display:inline-flex;align-items:center;gap:.4rem;padding:calc(var(--spacing)*2.5) calc(var(--spacing)*4);border:none;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:.84rem;cursor:pointer;transition:opacity .2s}
    .primary-btn:hover{opacity:.9}
    .primary-btn:disabled{opacity:.4;cursor:default}
    .comment-list{display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}
    .comment-item{display:flex;gap:calc(var(--spacing)*3);align-items:flex-start}
    .comment-avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:var(--muted);color:var(--foreground);font-weight:700;font-size:.8rem}
    .comment-body{flex:1;min-width:0}
    .comment-meta{display:flex;align-items:center;gap:calc(var(--spacing)*3);margin-bottom:.3rem}
    .comment-meta strong{font-size:.86rem}
    .comment-meta span{font-size:.74rem;color:var(--muted-foreground)}
    .comment-body p{font-size:.86rem;color:var(--muted-foreground);line-height:1.6}

    /* Sidebar */
    .sidebar{position:sticky;top:84px;display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}
    .sidebar-card{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:calc(var(--spacing)*4)}
    .ai-card{display:flex;flex-direction:column;gap:calc(var(--spacing)*2.5);background:linear-gradient(180deg,var(--muted) 0%,var(--card) 100%)}
    .ai-card-icon{width:44px;height:44px;border-radius:var(--radius);display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground)}
    .ai-card h3{font-size:1rem;font-weight:700}
    .ai-card p{font-size:.82rem;color:var(--muted-foreground);line-height:1.55}
    .ai-card .primary-btn{align-self:flex-start}
    .sidebar-title{font-size:.88rem;font-weight:700;margin-bottom:calc(var(--spacing)*3)}
    .sidebar-rows{display:flex;flex-direction:column}
    .sidebar-row{display:flex;justify-content:space-between;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*2.5) 0;border-top:1px solid var(--border);font-size:.84rem}
    .sidebar-row:first-child{border-top:none}
    .sidebar-row span{color:var(--muted-foreground)}
    .tag-list{display:flex;flex-wrap:wrap;gap:calc(var(--spacing)*2)}
    .side-tag{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .65rem;border-radius:999px;background:var(--muted);color:var(--foreground);font-size:.76rem}

    /* Related */
    .related-section{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*5) calc(var(--spacing)*8) calc(var(--spacing)*10);display:flex;flex-direction:column;gap:calc(var(--spacing)*4);border-top:1px solid var(--border)}
    .related-section .section-title h2{font-size:1.25rem}
    .related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--spacing)*4)}
    .related-card{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);overflow:hidden;cursor:pointer;transition:border-color .2s}
    .related-card:hover{border-color:var(--ring)}
    .related-cover{width:100%;height:130px;object-fit:cover;display:block}
    .related-body{padding:calc(var(--spacing)*3)}
    .related-body h3{font-size:.88rem;font-weight:600;line-height:1.4;margin-bottom:calc(var(--spacing)*2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .related-views{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;color:var(--muted-foreground)}

    /* Responsive */
    @media (max-width:1024px){
      .detail-layout{grid-template-columns:1fr;padding:calc(var(--spacing)*5)}
      .sidebar{position:static;flex-direction:row;flex-wrap:wrap}
      .sidebar-card{flex:1;min-width:220px}
      .head-actions{padding:calc(var(--spacing)*3) calc(var(--spacing)*5)}
      .related-section{padding:calc(var(--spacing)*5)}
    }
    @media (max-width:768px){
      .topbar{padding:0 calc(var(--spacing)*4)}
      .cover-wrap{height:300px}
      .cover-content{padding:calc(var(--spacing)*5)}
      .head-title{font-size:1.4rem}
      .back-link{display:none}
      .detail-layout{padding:calc(var(--spacing)*4)}
      .head-actions{padding:calc(var(--spacing)*3) calc(var(--spacing)*4)}
      .tips-grid,.related-grid{grid-template-columns:1fr}
      .comment-input-row{flex-direction:column;align-items:stretch}
    }
  </style>
</body>
</html>
