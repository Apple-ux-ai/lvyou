<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate — AI 旅行助手</title>
    <link rel="stylesheet" href="../shared/theme.css">



</head>
<body>
  <div id="root"></div>
  <script src="../shared/utils.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/site-nav.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="../shared/assistant-response.js"></script>
  <script src="../shared/components.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { detectResponseTopic, cleanMarkdownForDisplay } = window.TravelMate.assistantResponses;

    /* ── SVG Icons ── */
    function SendIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>; }
    function SparkleIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>; }
    function SunIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>; }
    function MoonIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>; }
    function ArrowLeftIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>; }
    function ArrowRightIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>; }
    function CheckIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>; }
    function BookmarkIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>; }
    function ClockIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>; }
    function MapPinIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>; }
    function WalletIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>; }
    function ChevronDownIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>; }
    function LightbulbIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>; }
    function QuoteIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/></svg>; }
    function HistoryIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>; }
    function PlusIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>; }
    function StopIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="10" height="10" x="7" y="7" rx="2" ry="2"/></svg>; }

    /* ── Data ── */
    const suggestionQuestions = [
      "五一去日本玩7天，预算1万，有什么推荐？",
      "冰岛冬季自驾安全吗？",
      "去大理玩几天合适？预算多少？",
      "日本签证需要什么材料？"
    ];

    const SESSION_KEY = "travelmate-sessions";
    const CHAT_SESSION_KEY = "travelmate-chat-session-id";
    const CHAT_HISTORY_KEY = "travelmate-chat-history";

    /* ── 本地存储：会话历史 ── */
    function loadSessions() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || []; } catch (e) { return []; }
    }
    function saveSessions(sessions) {
      try { localStorage.setItem(SESSION_KEY, JSON.stringify(sessions.slice(0, 20))); } catch (e) { /* ignore */ }
    }
    function createChatSessionId() {
      const id = (window.crypto && typeof window.crypto.randomUUID === "function")
        ? window.crypto.randomUUID()
        : "session-" + Date.now() + "-" + Math.random().toString(36).slice(2);
      try { localStorage.setItem(CHAT_SESSION_KEY, id); } catch (e) { /* ignore */ }
      return id;
    }
    function loadChatSessionId() {
      try {
        const existing = localStorage.getItem(CHAT_SESSION_KEY);
        return existing || createChatSessionId();
      } catch (e) {
        return "session-" + Date.now();
      }
    }
    function loadChatHistory() {
      try {
        const stored = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY) || "[]");
        return Array.isArray(stored) ? stored.slice(-40) : [];
      } catch (e) {
        return [];
      }
    }
    function saveChatHistory(messages) {
      try { localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(messages.slice(-40))); } catch (e) { /* ignore */ }
    }
    function historyForRequest(messages) {
      return messages
        .filter((message) => message && (message.role === "user" || message.role === "bot") && message.text)
        .slice(-6)
        .map((message) => ({
          role: message.role === "bot" ? "assistant" : "user",
          content: String(message.text).slice(0, 8000)
        }));
    }

    /* ── Components ── */
    function Topbar({ onHome, onNewChat }) {
      const [theme, setThemeState] = useState(() => (document.documentElement.classList.contains("dark") ? "dark" : "light"));
      const toggleTheme = () => setThemeState(window.TravelMate.utils.toggleTheme());
      return (
        <header className="topbar">
          <div className="topbar-left">
            <a className="brand" href="home.html">
              <div className="brand-icon"><SparkleIcon size={18} /></div>
              <span className="brand-text">TravelMate</span>
            </a>
            <span className="topbar-page-tag">AI 旅行助手</span>
          </div>
          <div className="topbar-right">
            <button className="icon-btn" title="切换主题" onClick={toggleTheme} aria-label="切换主题">
              {theme === "dark" ? <SunIcon size={18} /> : <MoonIcon size={18} />}
            </button>
            <button className="ghost-btn sm new-chat-btn" onClick={onNewChat} title="清空当前对话，开始新对话">
              <PlusIcon size={14} /> 新建对话
            </button>
            <a className="home-link" href="home.html">返回首页</a>
          </div>
        </header>
      );
    }

    function EmptyState({ onAsk }) {
      return (
        <div className="empty-state">
          <div className="empty-icon"><SparkleIcon size={28} /></div>
          <h2>开始规划你的旅程</h2>
          <p>描述你的旅行想法，AI 助手将为你生成个性化行程、预算方案与实用贴士</p>
          <div className="suggestion-list">
            {suggestionQuestions.map((q) => (
              <button key={q} className="suggestion-btn" onClick={() => onAsk(q)}>
                <QuoteIcon size={14} />
                <span>{q}</span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function isLikelyPlanRequest(text) {
      return /(?:想|准备|打算)?去[\u4e00-\u9fff]{2,8}(?:玩|旅游|旅行|逛)|行程|规划|路线|几天|预算/.test(text);
    }

    function responseTopicIcon(topic) {
      if (topic === "visa") return <CheckIcon size={15} />;
      if (topic === "weather") return <SunIcon size={15} />;
      if (topic === "budget") return <WalletIcon size={15} />;
      if (topic === "transport") return <ClockIcon size={15} />;
      if (topic === "itinerary") return <MapPinIcon size={15} />;
      return <SparkleIcon size={15} />;
    }

    function ChatBubble({ msg, isStreaming }) {
      if (msg.role === "user") {
        return (
          <div className="chat-row user">
            <div className="bubble user">{msg.text}</div>
          </div>
        );
      }
      return (
        <div className="chat-row bot">
          <div className="bot-avatar"><SparkleIcon size={14} /></div>
          <div className="bubble bot">
            {msg.text ? (
              <span className="plain-text-output">
                {msg.text}
                {isStreaming && <span className="stream-cursor" aria-hidden="true" />}
              </span>
            ) : msg.itinerary ? (
              <span className="plain-text-output">行程已生成，请查看右侧的结构化行程预览。</span>
            ) : (
              <span className="typing-dots"><span /> <span /> <span /></span>
            )}
            {msg.citations && msg.citations.length > 0 && (
              <div className="citations">
                <div className="citations-label">参考来源</div>
                {msg.citations.map((c, i) => (
                  <a key={i} className="citation-chip" href="guides.html" title={c.title}>
                    <QuoteIcon size={12} /> {c.title}
                  </a>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function ItineraryCard({ itinerary, onSave, saving, savedTripId }) {
      const [openDays, setOpenDays] = useState({});
      const toggleDay = (day) => setOpenDays((prev) => ({ ...prev, [day]: !prev[day] }));
      const allOpen = Object.keys(openDays).length === itinerary.day_plans.length && itinerary.day_plans.length > 0;
      const toggleAll = () => {
        if (allOpen) { setOpenDays({}); }
        else {
          const all = {};
          itinerary.day_plans.forEach((d) => { all[d.day] = true; });
          setOpenDays(all);
        }
      };
      const budgetPerDay = itinerary.total_budget && itinerary.days ? (itinerary.total_budget / itinerary.days) : null;

      return (
        <div className="itinerary-card" data-testid="itinerary-card">
          <div className="itinerary-head">
            <div className="itinerary-title-row">
              <div className="itinerary-title">
                <MapPinIcon size={16} />
                <strong>{itinerary.destination} {itinerary.days} 天行程</strong>
              </div>
              <button className="ghost-btn sm" onClick={toggleAll}>
                {allOpen ? "收起全部" : "展开全部"} <ChevronDownIcon size={12} />
              </button>
            </div>
            <div className="itinerary-meta">
              <span className="meta-pill"><ClockIcon size={12} /> {itinerary.days} 天</span>
              <span className="meta-pill"><WalletIcon size={12} /> {itinerary.total_budget ? "¥" + itinerary.total_budget.toLocaleString() + " /人" : "预算待估算"}</span>
            </div>
          </div>

          {itinerary.day_plans.length === 0 ? (
            <div className="empty-itinerary">暂无行程安排，尝试更具体地描述目的地和天数</div>
          ) : (
            <div className="day-list">
              {itinerary.day_plans.map((d) => {
                const open = !!openDays[d.day];
                return (
                  <div key={d.day} className={`day-item ${open ? "open" : ""}`}>
                    <button className="day-head" onClick={() => toggleDay(d.day)}>
                      <span className="day-badge">D{d.day}</span>
                      <span className="day-title">{d.title}</span>
                      <span className="day-chevron"><ChevronDownIcon size={14} /></span>
                    </button>
                    {open && (
                      <div className="day-body">
                        <ul className="activity-list">
                          {d.activities.map((a, i) => <li key={i}>{a}</li>)}
                        </ul>
                        <div className="day-foot">
                          <span>交通：{d.transport || "步行"}</span>
                          {d.budget != null && <span>预算：¥{d.budget.toLocaleString()}</span>}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {itinerary.tips && itinerary.tips.length > 0 && (
            <div className="itinerary-tips">
              <div className="tips-label"><LightbulbIcon size={12} /> 旅行贴士</div>
              <ul>
                {itinerary.tips.map((t, i) => <li key={i}>{t}</li>)}
              </ul>
            </div>
          )}

          {budgetPerDay && (
            <div className="budget-summary">
              <div className="budget-row">
                <span>日均预算</span>
                <strong>¥{budgetPerDay.toFixed(0)}</strong>
              </div>
              <div className="budget-row">
                <span>总预算（7 天基准）</span>
                <strong>¥{itinerary.total_budget.toLocaleString()}</strong>
              </div>
            </div>
          )}

          <div className="itinerary-actions">
            <button className="primary-btn" onClick={onSave} disabled={saving || Boolean(savedTripId)}>
              <BookmarkIcon size={14} /> {savedTripId ? "已保存" : saving ? "保存中..." : "保存行程"}
            </button>
            {savedTripId && (
              <button className="ghost-btn" onClick={() => window.TravelMate.utils.go("planner.html", { tripId: savedTripId })}>
                打开已保存行程
              </button>
            )}
            <button className="ghost-btn" onClick={() => {
              try {
                const draft = {
                  title: `${itinerary.destination} ${itinerary.days} 天行程`,
                  destination: itinerary.destination,
                  days: itinerary.days,
                  totalBudget: itinerary.total_budget || 8500,
                  tips: itinerary.tips || [],
                  dayPlans: (itinerary.day_plans || []).map((d) => ({
                    day: d.day,
                    title: d.title || `第 ${d.day} 天`,
                    items: (d.activities || []).map((a, i) => ({
                      id: `${d.day}-${i}`,
                      time: "10:00",
                      text: a,
                      cat: "ticket",
                      budget: Math.round((d.budget || 0) / Math.max(d.activities.length, 1))
                    }))
                  }))
                };
                localStorage.setItem("travelmate-planner-draft", JSON.stringify(draft));
                window.TravelMate.utils.go("planner.html");
              } catch (e) { alert("打开规划器失败"); }
            }}>编辑行程</button>
            <button className="ghost-btn">分享</button>
          </div>
        </div>
      );
    }

    function ChatPanel({ messages, onSend, onStop, streaming }) {
      const [input, setInput] = useState("");
      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, streaming]);

      const handleSend = () => {
        if (!input.trim() || streaming) return;
        onSend(input.trim());
        setInput("");
      };

      return (
        <div className="chat-panel">
          <div className="chat-messages" ref={scrollRef}>
            {messages.length === 0 ? (
              <EmptyState onAsk={(q) => { setInput(q); onSend(q); }} />
            ) : (
              messages.map((m, i) => (
                <ChatBubble
                  key={i}
                  msg={m}
                  isStreaming={streaming && i === messages.length - 1 && m.role === "bot"}
                />
              ))
            )}
          </div>
          <div className="chat-input-bar">
            <input
              className="chat-input"
              placeholder="描述你的旅行计划，如：五一去日本玩7天，预算1万"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") handleSend(); }}
              disabled={streaming}
            />
            {streaming ? (
              <button className="stop-btn" onClick={onStop} aria-label="停止生成" title="停止生成">
                <StopIcon size={16} /> 停止
              </button>
            ) : (
              <button className="send-btn" onClick={handleSend} disabled={!input.trim()} aria-label="发送">
                <SendIcon size={16} />
              </button>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [messages, setMessages] = useState(loadChatHistory);
      const [sessionId, setSessionId] = useState(loadChatSessionId);
      const [streaming, setStreaming] = useState(false);
      const [itinerary, setItinerary] = useState(null);
      const [sessions, setSessions] = useState(loadSessions);
      const [savedTip, setSavedTip] = useState(false);
      const [saving, setSaving] = useState(false);
      const [savedTripId, setSavedTripId] = useState(null);
      const [saveError, setSaveError] = useState("");
      const [planningPreview, setPlanningPreview] = useState(false);
      const streamTextRef = useRef("");
      const streamDisplayTextRef = useRef("");
      const streamTargetCharsRef = useRef([]);
      const streamDisplayCharsRef = useRef([]);
      const streamTimerRef = useRef(null);
      const streamDoneRef = useRef(false);
      const streamFinishedRef = useRef(false);
      const streamMsgIndexRef = useRef(-1);
      const abortRef = useRef(null);

      useEffect(() => {
        saveChatHistory(messages);
      }, [messages]);

      useEffect(() => {
        window.TravelMate.utils.initTheme();
        const q = window.TravelMate.utils.getQueryParam("query");
        if (q) sendMessage(q);
      }, []);

      function clearStreamTimer() {
        if (streamTimerRef.current !== null) {
          clearTimeout(streamTimerRef.current);
          streamTimerRef.current = null;
        }
      }

      function updateStreamMessage(text, citations) {
        setMessages((prev) => {
          const next = [...prev];
          const idx = streamMsgIndexRef.current;
          if (idx >= 0 && idx < next.length) {
            next[idx] = {
              ...next[idx],
              text,
              citations: citations && citations.length ? citations : next[idx].citations || []
            };
          }
          return next;
        });
      }

      function finishStream(question) {
        if (streamFinishedRef.current || !streamDoneRef.current) return;
        if (streamDisplayCharsRef.current.length < streamTargetCharsRef.current.length) return;
        streamFinishedRef.current = true;
        clearStreamTimer();
        setStreaming(false);
        setPlanningPreview(false);
        const newSession = {
          id: Date.now(),
          question,
          time: new Date().toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
        };
        const updated = [newSession, ...loadSessions()];
        saveSessions(updated);
        setSessions(updated);
      }

      function revealNextCharacter(question) {
        if (streamFinishedRef.current) return;
        const target = streamTargetCharsRef.current;
        const displayed = streamDisplayCharsRef.current;
        if (displayed.length > target.length) {
          displayed.length = target.length;
        }
        if (displayed.length < target.length) {
          displayed.push(target[displayed.length]);
          streamDisplayTextRef.current = displayed.join("");
          updateStreamMessage(streamDisplayTextRef.current);
          streamTimerRef.current = setTimeout(() => revealNextCharacter(question), 24);
          return;
        }
        streamTimerRef.current = null;
        finishStream(question);
      }

      function startReveal(question) {
        if (streamTimerRef.current === null) revealNextCharacter(question);
      }

      function sendMessage(text) {
        clearStreamTimer();
        const userMsg = { role: "user", text: text };
        const botMsg = { role: "bot", text: "", citations: [], topic: detectResponseTopic(text), itinerary: null };
        const newMessages = [...messages, userMsg, botMsg];
        setMessages(newMessages);
        setStreaming(true);
        setItinerary(null);
        setSavedTip(false);
        setSavedTripId(null);
        setSaveError("");
        setPlanningPreview(isLikelyPlanRequest(text));
        streamTextRef.current = "";
        streamDisplayTextRef.current = "";
        streamTargetCharsRef.current = [];
        streamDisplayCharsRef.current = [];
        streamDoneRef.current = false;
        streamFinishedRef.current = false;
        streamMsgIndexRef.current = newMessages.length - 1;
        if (abortRef.current) abortRef.current.abort();
        abortRef.current = new AbortController();

        window.TravelMate.api.chatStream(
          text,
          {
            signal: abortRef.current.signal,
            onMessage: (payload) => {
              streamTextRef.current += payload.text || "";
              streamTargetCharsRef.current = Array.from(cleanMarkdownForDisplay(streamTextRef.current));
              const citations = payload.citations || [];
              updateStreamMessage(streamDisplayTextRef.current, citations);
              startReveal(text);
            },
            onItinerary: (payload) => {
              setItinerary(payload);
              setMessages((prev) => {
                const next = [...prev];
                const idx = streamMsgIndexRef.current;
                if (idx >= 0 && idx < next.length) {
                  next[idx] = { ...next[idx], itinerary: payload, citations: payload.citations || next[idx].citations || [] };
                }
                return next;
              });
            },
            onDone: () => {
              abortRef.current = null;
              streamDoneRef.current = true;
              if (!streamTargetCharsRef.current.length) {
                streamTargetCharsRef.current = Array.from(cleanMarkdownForDisplay("已完成回答"));
              }
              startReveal(text);
            },
            onAbort: () => {
              clearStreamTimer();
              if (streamFinishedRef.current) { abortRef.current = null; return; }
              streamFinishedRef.current = true;
              streamDoneRef.current = true;
              const raw = streamTextRef.current || "";
              const base = raw ? cleanMarkdownForDisplay(raw) : (streamDisplayTextRef.current || "");
              const finalText = base ? base + "\n\n（已停止生成）" : "已停止生成，你可以继续提问或新建对话。";
              updateStreamMessage(finalText, []);
              abortRef.current = null;
              setStreaming(false);
              setPlanningPreview(false);
            },
            onError: (payload) => {
              abortRef.current = null;
              clearStreamTimer();
              if (payload && payload.code === "session_expired") {
                const nextSessionId = createChatSessionId();
                setSessionId(nextSessionId);
              }
              const errorText = payload && payload.code === "session_expired"
                ? "会话已过期，已为你开启新的对话。"
                : payload && payload.code === "rate_limited"
                  ? `请求太频繁，请在 ${payload.retry_after || 60} 秒后再试。`
                  : "连接服务失败，请确认后端已启动（python -m uvicorn app.main:app --port 8000）。";
              streamTargetCharsRef.current = Array.from(errorText);
              streamDisplayCharsRef.current = [...streamTargetCharsRef.current];
              streamDisplayTextRef.current = errorText;
              streamDoneRef.current = true;
              updateStreamMessage(errorText, []);
              streamFinishedRef.current = true;
              setStreaming(false);
              setPlanningPreview(false);
            }
          },
          historyForRequest(messages),
          sessionId
        );
      }

      function cancelGeneration() {
        if (!streaming || streamFinishedRef.current) return;
        if (abortRef.current) abortRef.current.abort();
      }

      function newConversation() {
        if (messages.length > 0 && !window.confirm("确定要新建对话吗？当前对话内容将被清空。")) return;
        clearStreamTimer();
        if (abortRef.current) abortRef.current.abort();
        abortRef.current = null;
        streamFinishedRef.current = true;
        streamDoneRef.current = true;
        setStreaming(false);
        setPlanningPreview(false);
        setMessages([]);
        saveChatHistory([]);
        setSessionId(createChatSessionId());
        setItinerary(null);
        setSavedTip(false);
        setSavedTripId(null);
        setSaveError("");
      }

      const handleSaveTrip = () => {
        if (!itinerary || saving || savedTripId) return;
        setSaving(true);
        setSaveError("");
        window.TravelMate.api.saveTrip(itinerary, (trip) => {
          setSaving(false);
          setSavedTripId(trip.id);
          setSavedTip(true);
          setTimeout(() => setSavedTip(false), 2500);
        }, (error) => {
          setSaving(false);
          setSaveError(error && error.message ? `保存失败：${error.message}` : "保存失败，请稍后重试");
        });
      };

      return (
        <div className="app">
          <Topbar onNewChat={newConversation} />
          <div className="assistant-layout">
            <div className="chat-panel-wrap">
              <ChatPanel messages={messages} onSend={sendMessage} onStop={cancelGeneration} streaming={streaming} />
            </div>
            <aside className="preview-panel" id="itinerary-preview">
              <div className="preview-head">
                <span className="preview-title">行程预览</span>
                {savedTip && <span className="saved-tip"><CheckIcon size={12} /> 已保存</span>}
              </div>
              {itinerary ? (
                <>
                  <ItineraryCard itinerary={itinerary} onSave={handleSaveTrip} saving={saving} savedTripId={savedTripId} />
                  {saveError && <div className="save-error" role="alert">{saveError}<button className="ghost-btn sm" onClick={handleSaveTrip}>重试保存</button></div>}
                </>
              ) : (planningPreview && streaming) ? (
                <div className="preview-loading" role="status">
                  <div className="preview-empty-icon"><SparkleIcon size={24} /></div>
                  <p>正在生成你的行程</p>
                  <p className="preview-empty-sub">正在整理路线、交通和预算</p>
                </div>
              ) : (
                <div className="preview-empty">
                  <div className="preview-empty-icon"><MapPinIcon size={24} /></div>
                  <p>在这里查看 AI 生成的行程</p>
                  <p className="preview-empty-sub">试试输入「五一去日本玩7天，预算1万」</p>
                </div>
              )}
              {sessions.length > 0 && (
                <div className="history-panel">
                  <div className="history-title"><HistoryIcon size={14} /> 最近会话</div>
                  <ul className="history-list">
                    {sessions.slice(0, 5).map((s) => (
                      <li key={s.id} className="history-item">
                        <span className="history-q">{s.question}</span>
                        <span className="history-time">{s.time}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </aside>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

    .history-item{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--spacing)*2);padding:calc(var(--spacing)*2) 0;border-top:1px solid var(--border);font-size:.8rem}
    .history-item:first-child{border-top:none}
    .history-q{color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .history-time{color:var(--muted-foreground);font-size:.72rem;flex:0 0 auto}

    /* Responsive */
    @media (max-width:1024px){
      .assistant-layout{grid-template-columns:1fr;padding:calc(var(--spacing)*4);overflow-y:auto}
      .preview-panel{height:auto;max-height:none;overflow:visible}
    }
    @media (max-width:768px){
      .topbar{padding:0 calc(var(--spacing)*4)}
      .topbar-page-tag{display:none}
      .assistant-layout{padding:calc(var(--spacing)*3);gap:calc(var(--spacing)*3)}
      .chat-panel-wrap{min-height:60vh}
      .chat-row{max-width:92%}
      .structured-message-layout{grid-template-columns:1fr}
      .message-facts{grid-template-columns:1fr}
      .message-fact{border-left:0;border-top:1px solid var(--border);padding-inline:0}
      .message-fact:first-child{border-top:0}
      .conversation-itinerary-head{flex-direction:column;gap:calc(var(--spacing)*2)}
      .conversation-budget{padding-left:calc(28px + var(--spacing)*2.5)}
      .conversation-route-row{grid-template-columns:44px minmax(0,1fr)}
      .home-link{display:none}
    }
  </style>
</body>
</html>
