<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate — 汇率换算</title>
    <link rel="stylesheet" href="../shared/theme.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>


</head>
<body>
  <div id="root"></div>
  <script src="../shared/utils.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/site-nav.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ── SVG Icons ── */
    function SparkleIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>; }
    function SunIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>; }
    function MoonIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>; }
    function ArrowLeftIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>; }
    function SwapIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="m21 3-6.37 6.37"/><path d="M3 21l6.37-6.37"/></svg>; }
    function RefreshIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>; }
    function TrendingUpIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>; }
    function AlertIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>; }

    /* ── 货币数据（参考汇率，基准 CNY=1；2026-07 快照，演示用静态值） ── */
    const CURRENCIES = [
      { code: "CNY", name: "人民币", symbol: "¥", rate: 1, flag: "🇨🇳" },
      { code: "JPY", name: "日元", symbol: "¥", rate: 0.0465, flag: "🇯🇵" },
      { code: "USD", name: "美元", symbol: "$", rate: 7.22, flag: "🇺🇸" },
      { code: "EUR", name: "欧元", symbol: "€", rate: 7.82, flag: "🇪🇺" },
      { code: "ISK", name: "冰岛克朗", symbol: "kr", rate: 0.0528, flag: "🇮🇸" },
      { code: "THB", name: "泰铢", symbol: "฿", rate: 0.206, flag: "🇹🇭" },
      { code: "IDR", name: "印尼盾", symbol: "Rp", rate: 0.00045, flag: "🇮🇩" },
      { code: "CHF", name: "瑞士法郎", symbol: "Fr", rate: 8.14, flag: "🇨🇭" }
    ];

    const QUICK_AMOUNTS = [100, 500, 1000, 5000, 10000];

    function fmt(n) {
      if (n >= 100000) return n.toLocaleString("zh-CN", { maximumFractionDigits: 0 });
      if (n >= 100) return n.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
      return n.toLocaleString("zh-CN", { maximumFractionDigits: 4 });
    }

    function Topbar() {
      const [theme, setThemeState] = useState(() => (document.documentElement.classList.contains("dark") ? "dark" : "light"));
      const toggleTheme = () => setThemeState(window.TravelMate.utils.toggleTheme());
      return (
        <header className="topbar">
          <div className="topbar-left">
            <a className="brand" href="home.html">
              <div className="brand-icon"><SparkleIcon size={18} /></div>
              <span className="brand-text">TravelMate</span>
            </a>
            <a className="back-link" href="home.html"><ArrowLeftIcon size={14} /> 返回首页</a>
          </div>
          <div className="topbar-right">
            <button className="icon-btn" title="切换主题" onClick={toggleTheme} aria-label="切换主题">
              {theme === "dark" ? <SunIcon size={18} /> : <MoonIcon size={18} />}
            </button>
            <div className="avatar">旅</div>
          </div>
        </header>
      );
    }

    function PageHead() {
      return (
        <div className="page-head">
          <h1>汇率换算</h1>
          <p>多币种实时换算 · 参考汇率更新于 2026-07，实际以银行/支付平台为准</p>
        </div>
      );
    }

    function ConverterCard() {
      const [fromCode, setFromCode] = useState("CNY");
      const [toCode, setToCode] = useState("JPY");
      const [amount, setAmount] = useState("1000");

      const from = CURRENCIES.find((c) => c.code === fromCode);
      const to = CURRENCIES.find((c) => c.code === toCode);
      const num = parseFloat(amount) || 0;
      const result = (num * from.rate) / to.rate;

      const swap = () => { setFromCode(toCode); setToCode(fromCode); };

      return (
        <div className="conv-card">
          <div className="conv-row">
            <div className="conv-box">
              <label className="conv-label">金额</label>
              <div className="conv-input-wrap">
                <span className="conv-symbol">{from.symbol}</span>
                <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" />
              </div>
              <div className="quick-row">
                {QUICK_AMOUNTS.map((q) => (
                  <button key={q} className={`quick-chip ${num === q ? "active" : ""}`} onClick={() => setAmount(String(q))}>{q}</button>
                ))}
              </div>
            </div>
            <button className="swap-btn" onClick={swap} aria-label="交换货币"><SwapIcon size={16} /></button>
            <div className="conv-box">
              <label className="conv-label">目标金额</label>
              <div className="conv-result">
                <span className="conv-symbol">{to.symbol}</span>
                <strong>{fmt(result)}</strong>
              </div>
              <div className="rate-note">1 {from.code} = {fmt(from.rate / to.rate)} {to.code}</div>
            </div>
          </div>
          <div className="select-row">
            <div className="select-box">
              <span className="select-flag">{from.flag}</span>
              <select value={fromCode} onChange={(e) => setFromCode(e.target.value)}>
                {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.code} · {c.name}</option>)}
              </select>
            </div>
            <div className="select-box">
              <span className="select-flag">{to.flag}</span>
              <select value={toCode} onChange={(e) => setToCode(e.target.value)}>
                {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.code} · {c.name}</option>)}
              </select>
            </div>
          </div>
        </div>
      );
    }

    function RateTable({ baseCode }) {
      const base = CURRENCIES.find((c) => c.code === baseCode);
      return (
        <div className="rate-table">
          <div className="rate-head">
            <h3>人民币汇率一览</h3>
            <button className="refresh-btn"><RefreshIcon size={13} /> 刷新</button>
          </div>
          <div className="rate-rows">
            {CURRENCIES.filter((c) => c.code !== "CNY").map((c) => (
              <div key={c.code} className="rate-row">
                <span className="rate-flag">{c.flag}</span>
                <div className="rate-main">
                  <strong>{c.code} · {c.name}</strong>
                  <span className="rate-sub">1 CNY = {fmt(1 / c.rate)} {c.code}</span>
                </div>
                <span className="rate-val">{c.symbol} {fmt(c.rate)}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [theme, setThemeState] = useState(() => (document.documentElement.classList.contains("dark") ? "dark" : "light"));
      useEffect(() => {
        window.TravelMate.utils.initTheme();
      }, []);
      const toggleTheme = () => setThemeState(window.TravelMate.utils.toggleTheme());

      return (
        <div className="app">
          <Topbar />
          <PageHead />
          <div className="currency-body">
            <ConverterCard />
            <RateTable baseCode="CNY" />
            <div className="tip-banner">
              <AlertIcon size={14} />
              <p>以上为参考汇率，实际兑换请以银行、支付宝/微信或当地兑换点实时牌价为准；大额兑换建议提前比较汇率。</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);letter-spacing:var(--tracking-normal);line-height:1.55}
    button,input,select{font:inherit}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:100;height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*4);padding:0 calc(var(--spacing)*8);background:var(--background);backdrop-filter:blur(8px)}
    .brand-icon{width:36px;height:36px;border-radius:calc(var(--radius) + 4px);display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground);font-weight:700}
    .brand-text{font-size:1.1rem;font-weight:700;letter-spacing:-0.01em}
    .back-link{display:inline-flex;align-items:center;gap:.35rem;color:var(--muted-foreground);text-decoration:none;font-size:.86rem;transition:color .2s}
    .back-link:hover{color:var(--primary)}

    /* Page Head */
    .page-head{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*7) calc(var(--spacing)*8) calc(var(--spacing)*4);display:flex;flex-direction:column;gap:calc(var(--spacing)*2)}
    .page-head h1{font-size:1.9rem;font-weight:700;letter-spacing:-0.02em}
    .page-head p{color:var(--muted-foreground);font-size:.88rem}

    /* Body */
    .currency-body{max-width:820px;margin:0 auto;padding:0 calc(var(--spacing)*8) calc(var(--spacing)*10);display:flex;flex-direction:column;gap:calc(var(--spacing)*5)}

    /* Converter */
    .conv-card{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:calc(var(--spacing)*5);display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}
    .conv-row{display:flex;align-items:center;gap:calc(var(--spacing)*4)}
    .conv-box{flex:1;min-width:0}
    .conv-label{display:block;font-size:.78rem;font-weight:600;color:var(--muted-foreground);margin-bottom:calc(var(--spacing)*2)}
    .conv-input-wrap{display:flex;align-items:center;gap:.4rem;padding:calc(var(--spacing)*2.5) calc(var(--spacing)*3.5);border:1px solid var(--input);border-radius:var(--radius);background:var(--popover);transition:border-color .2s,box-shadow .2s}
    .conv-input-wrap:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px rgba(66,133,244,.12)}
    .conv-symbol{color:var(--muted-foreground);font-size:1rem}
    .conv-input-wrap input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--foreground);font-size:1.15rem;font-family:var(--font-mono);text-align:right}
    .conv-result{display:flex;align-items:baseline;gap:.5rem;padding:calc(var(--spacing)*2.5) calc(var(--spacing)*3.5);border:1px solid var(--ring);border-radius:var(--radius);background:var(--muted)}
    .conv-result strong{font-size:1.25rem;font-family:var(--font-mono);color:var(--muted-foreground)}
    .quick-row{display:flex;gap:calc(var(--spacing)*1.5);margin-top:calc(var(--spacing)*2.5)}
    .quick-chip{padding:calc(var(--spacing)*1.3) calc(var(--spacing)*2.2);border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--muted-foreground);font-size:.74rem;cursor:pointer;transition:all .2s}
    .quick-chip:hover{border-color:var(--primary);color:var(--primary)}
    .quick-chip.active{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
    .rate-note{margin-top:calc(var(--spacing)*2);font-size:.76rem;color:var(--muted-foreground);font-family:var(--font-mono)}
    .swap-btn{flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:var(--card);color:var(--primary);cursor:pointer;transition:background .2s;margin-top:20px}
    .swap-btn:hover{background:var(--primary-soft)}
    .select-row{display:flex;gap:calc(var(--spacing)*4)}
    .select-box{flex:1;display:flex;align-items:center;gap:.6rem;padding:calc(var(--spacing)*2.5) calc(var(--spacing)*3.5);border:1px solid var(--border);border-radius:var(--radius);background:var(--popover)}
    .select-flag{font-size:1.2rem;line-height:1}
    .select-box select{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--foreground);font-size:.88rem;font-weight:600;cursor:pointer}

    /* Rate Table */
    .rate-table{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);overflow:hidden}
    .rate-head{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--spacing)*3.5) calc(var(--spacing)*4);border-bottom:1px solid var(--border)}
    .rate-head h3{font-size:.95rem;font-weight:700}
    .refresh-btn{display:inline-flex;align-items:center;gap:.35rem;padding:calc(var(--spacing)*1.5) calc(var(--spacing)*2.5);border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--muted-foreground);font-size:.76rem;cursor:pointer;transition:all .2s}
    .refresh-btn:hover{border-color:var(--primary);color:var(--primary)}
    .rate-row{display:flex;align-items:center;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*3) calc(var(--spacing)*4);border-top:1px solid var(--border)}
    .rate-row:first-of-type{border-top:none}
    .rate-flag{font-size:1.3rem;line-height:1}
    .rate-main{flex:1;min-width:0}
    .rate-main strong{display:block;font-size:.86rem;margin-bottom:.1rem}
    .rate-sub{font-size:.72rem;color:var(--muted-foreground);font-family:var(--font-mono)}
    .rate-val{flex:0 0 auto;font-family:var(--font-mono);font-size:.88rem}

    /* Tip */
    .tip-banner{display:flex;gap:.7rem;padding:calc(var(--spacing)*3.5);border-radius:var(--radius);background:var(--muted);font-size:.82rem;color:var(--muted-foreground);line-height:1.6}
    .tip-banner svg{flex:0 0 auto;color:var(--primary);margin-top:.15rem}

    /* Responsive */
    @media (max-width:1024px){
      .currency-body{padding-left:calc(var(--spacing)*5);padding-right:calc(var(--spacing)*5)}
    }
    @media (max-width:768px){
      .topbar{padding:0 calc(var(--spacing)*4)}
      .back-link{display:none}
      .page-head{padding:calc(var(--spacing)*6) calc(var(--spacing)*4) calc(var(--spacing)*3)}
      .currency-body{padding:0 calc(var(--spacing)*4) calc(var(--spacing)*8)}
      .conv-row{flex-direction:column;align-items:stretch}
      .swap-btn{margin:0 auto;transform:rotate(90deg)}
      .select-row{flex-direction:column}
      .quick-row{flex-wrap:wrap}
    }
  </style>
</body>
</html>
