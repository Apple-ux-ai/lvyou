              {theme === "dark" ? <SunIcon size={18} /> : <MoonIcon size={18} />}
            </button>
            <button className="icon-btn" title="收藏"><HeartIcon size={18} /></button>
            <div className="avatar">旅</div>
          </div>
        </header>
      );
    }

    function Hero({ dest }) {
      return (
        <div className="hero" style={{ backgroundImage: `url(${dest.img})` }}>
          <div className="hero-overlay"></div>
          <div className="hero-content">
            <div className="hero-tags">
              <span className="hero-tag">{dest.tag}</span>
              <span className="hero-tag rating"><StarIcon size={12} /> {dest.rating}</span>
            </div>
            <h1 className="hero-title">{dest.fullName}</h1>
            <p className="hero-desc">{dest.desc}</p>
            <div className="hero-meta">
              <span><ClockIcon size={14} /> {dest.duration}</span>
              <span><WalletIcon size={14} /> {dest.budget}</span>
              <span><MapPinIcon size={14} /> {dest.bestSeason}</span>
            </div>
          </div>
        </div>
      );
    }

    function OverviewTab({ dest }) {
      return (
        <div className="tab-content">
          <div className="overview-grid">
            <div className="overview-main">
              <h3>目的地介绍</h3>
              <p className="overview-text">{dest.tabs.overview}</p>
              <h3>签证信息</h3>
              <p className="overview-text">{dest.visa}</p>
            </div>
            <div className="overview-side">
              <div className="info-card">
                <h4>旅行信息</h4>
                <div className="info-row"><span>最佳季节</span><strong>{dest.bestSeason}</strong></div>
                <div className="info-row"><span>建议天数</span><strong>{dest.duration}</strong></div>
                <div className="info-row"><span>人均预算</span><strong>{dest.budget}</strong></div>
                <div className="info-row"><span>签证</span><strong>{dest.visa}</strong></div>
                <button className="primary-btn" onClick={() => window.TravelMate.utils.go("assistant.html", { query: `帮我规划${dest.name}${dest.duration.split("-")[0]}天行程` })}>
                  用 AI 规划行程 <ArrowRightIcon size={14} />
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SpotsTab({ dest }) {
      return (
        <div className="tab-content">
          <div className="spots-grid">
            {dest.tabs.spots.map((spot, i) => (
              <div key={i} className="spot-card">
                <img className="spot-img" src={spot.img} alt={spot.name} loading="lazy" />
                <div className="spot-body">
                  <div className="spot-name-row">
                    <strong className="spot-name">{spot.name}</strong>
                    <span className="spot-rating"><StarIcon size={12} /> {spot.rating}</span>
                  </div>
                  <p className="spot-desc">{spot.desc}</p>
                  <span className="spot-price">门票 {spot.price}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function FoodTab({ dest }) {
      return (
        <div className="tab-content">
          <div className="food-grid">
            {dest.tabs.food.map((item, i) => (
              <div key={i} className="food-card">
                <div className="food-icon"><UtensilsIcon size={18} /></div>
                <div className="food-info">
                  <div className="food-name-row">
                    <strong>{item.name}</strong>
                    <span className="food-price">{item.price}</span>
                  </div>
                  <p>{item.desc}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function StayTab({ dest }) {
      return (
        <div className="tab-content">
          <div className="stay-grid">
            {dest.tabs.stay.map((item, i) => (
              <div key={i} className="stay-card">
                <div className="stay-icon"><BedIcon size={18} /></div>
                <div className="stay-info">
                  <div className="stay-name-row">
                    <strong>{item.name}</strong>
                    <span className="stay-price">{item.price}</span>
                  </div>
                  <p>{item.desc}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function TransportTab({ dest }) {
      return (
        <div className="tab-content">
          <div className="info-card wide">
            <h4><BusIcon size={16} /> 交通指南</h4>
            <p className="overview-text">{dest.tabs.transport}</p>
          </div>
        </div>
      );
    }

    function TipsTab({ dest }) {
      return (
        <div className="tab-content">
          <div className="tips-list">
            {dest.tabs.tips.map((tip, i) => (
              <div key={i} className="tip-item">
                <div className="tip-num">{String(i + 1).padStart(2, "0")}</div>
                <p>{tip}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ItineraryPreview({ dest }) {
      return (
        <section className="section">
          <div className="section-head">
            <h2>推荐行程</h2>
            <button type="button" className="view-all" onClick={() => window.TravelMate.utils.go("assistant.html", { query: `帮我规划${dest.name}7天行程` })}>用 AI 定制 <ArrowRightIcon size={14} /></button>
          </div>
          <div className="route-card">
            <div className="route-head">
              <span className="route-title"><MapPinIcon size={16} /> {dest.name} 经典 {dest.duration.split("-")[0]} 日线路</span>
              <span className="route-badge">约 {dest.budget}</span>
            </div>
            <div className="route-days">
              {[1, 2, 3, 4, 5].slice(0, parseInt(dest.duration.split("-")[0])).map((d) => (
                <div key={d} className="route-day">
                  <div className="route-day-badge">D{d}</div>
                  <div className="route-day-title">第{d}天 · {d === 1 ? "抵达探索" : d === 5 ? "深度体验" : "经典路线"}</div>
                  <div className="route-day-sub">核心景点 + 当地美食</div>
                </div>
              ))}
            </div>
            <button className="primary-btn" onClick={() => window.TravelMate.utils.go("assistant.html", { query: `帮我规划${dest.name}${dest.duration.split("-")[0]}天行程` })}>
              生成完整行程 <ArrowRightIcon size={14} />
            </button>
          </div>
        </section>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState("overview");
      const destId = window.TravelMate.utils.getQueryParam("id") || defaultDest;
      const dest = destinations[destId] || destinations[defaultDest];

      useEffect(() => {
        window.TravelMate.utils.initTheme();
      }, []);

      return (
        <div className="app">
          <Topbar />
          <Hero dest={dest} />
          <div className="dest-layout">
            <nav className="tab-nav">
              {tabLabels.map((t) => (
                <button key={t.id} className={`tab-btn ${activeTab === t.id ? "active" : ""}`} onClick={() => setActiveTab(t.id)}>
                  {t.icon} {t.label}
                </button>
              ))}
            </nav>
            <div className="tab-panel">
              {activeTab === "overview" && <OverviewTab dest={dest} />}
              {activeTab === "spots" && <SpotsTab dest={dest} />}
              {activeTab === "food" && <FoodTab dest={dest} />}
              {activeTab === "stay" && <StayTab dest={dest} />}
              {activeTab === "transport" && <TransportTab dest={dest} />}
              {activeTab === "tips" && <TipsTab dest={dest} />}
            </div>
            <ItineraryPreview dest={dest} />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);letter-spacing:var(--tracking-normal);line-height:1.55}
    button,input{font:inherit}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:100;height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*4);padding:0 calc(var(--spacing)*8);background:var(--background);backdrop-filter:blur(8px)}
    .brand-icon{width:36px;height:36px;border-radius:calc(var(--radius) + 4px);display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground);font-weight:700}
    .brand-text{font-size:1.1rem;font-weight:700;letter-spacing:-0.01em}
    .back-link{display:inline-flex;align-items:center;gap:.35rem;color:var(--muted-foreground);text-decoration:none;font-size:.86rem;transition:color .2s}
    .back-link:hover{color:var(--primary)}
    .icon-btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

    /* Hero */
    .hero{position:relative;height:420px;background-size:cover;background-position:center}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,17,21,.15) 0%,rgba(14,17,21,.72) 100%)}
    .hero-content{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--spacing)*8);display:flex;flex-direction:column;gap:calc(var(--spacing)*3)}
    .hero-tags{display:flex;gap:calc(var(--spacing)*2)}
    .hero-tag{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff;font-size:.78rem;font-weight:600}
    .hero-tag.rating{background:rgba(251,188,5,.22)}
    .hero-title{color:#fff;font-size:2.2rem;font-weight:700;letter-spacing:-0.02em}
    .hero-desc{color:rgba(255,255,255,.88);font-size:1rem;max-width:620px}
    .hero-meta{display:flex;gap:calc(var(--spacing)*5);flex-wrap:wrap}
    .hero-meta span{display:inline-flex;align-items:center;gap:.35rem;color:rgba(255,255,255,.9);font-size:.84rem}

    /* Layout */
    .dest-layout{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*6) calc(var(--spacing)*8) calc(var(--spacing)*10);display:flex;flex-direction:column;gap:calc(var(--spacing)*7)}

    /* Tab Nav */
    .tab-nav{display:flex;gap:calc(var(--spacing)*2);border-bottom:1px solid var(--border);overflow-x:auto}
    .tab-btn{display:inline-flex;align-items:center;gap:.4rem;padding:calc(var(--spacing)*3) calc(var(--spacing)*4);border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted-foreground);cursor:pointer;font-size:.9rem;font-weight:600;white-space:nowrap;transition:color .2s}
    .tab-btn:hover{color:var(--foreground)}
    .tab-btn.active{color:var(--primary);border-color:var(--primary)}
    .tab-btn svg{flex:0 0 auto}

    /* Tab Panel */
    .tab-panel{min-height:200px}
    .tab-content{display:flex;flex-direction:column;gap:calc(var(--spacing)*5)}

    /* Overview */
    .overview-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:calc(var(--spacing)*6);align-items:start}
    .overview-main h3{font-size:1.15rem;font-weight:700;margin-bottom:calc(var(--spacing)*2.5)}
    .overview-text{color:var(--muted-foreground);font-size:.92rem;line-height:1.8;margin-bottom:calc(var(--spacing)*5)}
    .info-card{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:calc(var(--spacing)*5);display:flex;flex-direction:column;gap:calc(var(--spacing)*3)}
    .info-card h4{font-size:.95rem;font-weight:700;margin-bottom:calc(var(--spacing)*1)}
    .info-card.wide{max-width:720px}
    .info-row{display:flex;justify-content:space-between;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*2.5) 0;border-top:1px solid var(--border);font-size:.86rem}
    .info-row span{color:var(--muted-foreground)}
    .primary-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:calc(var(--spacing)*3) calc(var(--spacing)*4.5);border:none;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:.88rem;cursor:pointer;transition:opacity .2s}
    .primary-btn:hover{opacity:.9}

    /* Spots */
    .spots-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--spacing)*4)}
    .spot-card{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);overflow:hidden;transition:border-color .2s}
    .spot-card:hover{border-color:var(--ring)}
    .spot-img{width:100%;height:150px;object-fit:cover;display:block}
    .spot-body{padding:calc(var(--spacing)*3.5)}
    .spot-name-row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*2);margin-bottom:.3rem}
    .spot-name{font-size:.92rem}
    .spot-rating{display:inline-flex;align-items:center;gap:.2rem;color:var(--chart-3);font-size:.78rem;font-weight:700}
    .spot-desc{font-size:.8rem;color:var(--muted-foreground);line-height:1.5;margin-bottom:calc(var(--spacing)*2)}
    .spot-price{display:inline-block;padding:.25rem .6rem;border-radius:999px;background:var(--muted);color:var(--muted-foreground);font-size:.74rem;font-weight:600}

    /* Food */
    .food-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--spacing)*4)}
    .food-card{display:flex;gap:calc(var(--spacing)*3.5);align-items:flex-start;padding:calc(var(--spacing)*4);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);transition:border-color .2s}
    .food-card:hover{border-color:var(--ring)}
    .food-icon{width:42px;height:42px;flex:0 0 42px;border-radius:var(--radius);display:grid;place-items:center;background:var(--muted);color:var(--primary)}
    .food-name-row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*2);margin-bottom:.2rem}
    .food-price{color:var(--primary);font-weight:600;font-size:.8rem;white-space:nowrap}
    .food-info p{font-size:.82rem;color:var(--muted-foreground);line-height:1.5}

    /* Stay */
    .stay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--spacing)*4)}
    .stay-card{display:flex;gap:calc(var(--spacing)*3.5);align-items:flex-start;padding:calc(var(--spacing)*4);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);transition:border-color .2s}
    .stay-card:hover{border-color:var(--ring)}
    .stay-icon{width:42px;height:42px;flex:0 0 42px;border-radius:var(--radius);display:grid;place-items:center;background:var(--muted);color:var(--primary)}
    .stay-name-row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*2);margin-bottom:.2rem}
    .stay-price{color:var(--muted-foreground);font-weight:600;font-size:.76rem;white-space:nowrap}
    .stay-info p{font-size:.82rem;color:var(--muted-foreground);line-height:1.5}

    /* Tips */
    .tips-list{display:flex;flex-direction:column;gap:calc(var(--spacing)*2.5)}
    .tip-item{display:flex;align-items:flex-start;gap:calc(var(--spacing)*3.5);padding:calc(var(--spacing)*4);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card)}
    .tip-num{flex:0 0 auto;font-family:var(--font-mono);font-size:1.1rem;font-weight:700;color:var(--primary);opacity:.4}
    .tip-item p{font-size:.88rem;color:var(--foreground);line-height:1.6}

    /* Section / Route */
    .section{display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}
    .section-head{display:flex;justify-content:space-between;align-items:center}
    .section-head h2{font-size:1.3rem;font-weight:700}
    .view-all{display:inline-flex;align-items:center;gap:.3rem;border:0;background:transparent;color:var(--primary);font-size:.86rem;font-weight:600;cursor:pointer}
    .view-all:hover{text-decoration:underline}
    .route-card{border:1px solid var(--border);border-radius:calc(var(--radius) + 8px);background:var(--card);padding:calc(var(--spacing)*5);display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}
    .route-head{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*3);flex-wrap:wrap}
    .route-title{display:inline-flex;align-items:center;gap:.4rem;font-size:1rem;font-weight:700}
    .route-title svg{color:var(--primary)}
    .route-badge{padding:.3rem .7rem;border-radius:999px;background:var(--muted);color:var(--muted-foreground);font-size:.78rem;font-weight:600}
    .route-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:calc(var(--spacing)*3)}
    .route-day{padding:calc(var(--spacing)*3.5);border:1px solid var(--border);border-radius:var(--radius);background:var(--background)}
    .route-day-badge{display:inline-flex;width:34px;height:26px;align-items:center;justify-content:center;border-radius:6px;background:var(--primary);color:var(--primary-foreground);font-weight:700;font-size:.72rem;font-family:var(--font-mono);margin-bottom:calc(var(--spacing)*2)}
    .route-day-title{font-size:.84rem;font-weight:600;margin-bottom:.15rem}
    .route-day-sub{font-size:.74rem;color:var(--muted-foreground)}
    .route-card .primary-btn{align-self:flex-start}

    /* Responsive */
    @media (max-width:1024px){
      .spots-grid{grid-template-columns:repeat(2,1fr)}
      .stay-grid{grid-template-columns:1fr}
      .overview-grid{grid-template-columns:1fr}
      .dest-layout{padding:calc(var(--spacing)*5) calc(var(--spacing)*5) calc(var(--spacing)*8)}
    }
    @media (max-width:768px){
      .topbar{padding:0 calc(var(--spacing)*4)}
      .hero{height:340px}
      .hero-content{padding:calc(var(--spacing)*5)}
      .hero-title{font-size:1.6rem}
      .dest-layout{padding:calc(var(--spacing)*4) calc(var(--spacing)*4) calc(var(--spacing)*7)}
      .spots-grid,.food-grid{grid-template-columns:1fr}
      .back-link{display:none}
    }
  </style>
</body>
</html>
