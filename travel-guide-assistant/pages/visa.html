<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate — 签证查询</title>
    <link rel="stylesheet" href="../shared/theme.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>


</head>
<body>
  <div id="root"></div>
  <script src="../shared/utils.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/site-nav.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* ── SVG Icons ── */
    function SparkleIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>; }
    function SunIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>; }
    function MoonIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>; }
    function ArrowLeftIcon({ size = 16 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>; }
    function SearchIcon({ size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>; }
    function PassportIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2h4a2 2 0 0 1 2 2v2H8V4a2 2 0 0 1 2-2Z"/><path d="M4 6h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/><path d="M8 13a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/><path d="M12 11v4"/><path d="M10 13h4"/></svg>; }
    function ClockIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>; }
    function CalendarIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>; }
    function WalletIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>; }
    function FileCheckIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></svg>; }
    function AlertIcon({ size = 14 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>; }
    function CheckIcon({ size = 12 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>; }

    /* ── Data（来源：工具知识库，更新于 2026-07） ── */
    const VISA_DATA = [
      { id: "jp", country: "日本", flag: "🇯🇵", type: "需办理签证", level: "medium", fee: "约 ¥300-600", duration: "5-7 个工作日", stay: "15/30/90 天", docs: ["护照（6 个月以上有效期）", "签证申请表", "在职证明 + 营业执照", "银行流水（余额 3 万+）", "行程单 + 酒店预订单"], note: "单次/多次可选，代办更省心；部分领区简化材料。" },
      { id: "is", country: "冰岛", flag: "🇮🇸", type: "申根签证", level: "hard", fee: "约 ¥800-1200", duration: "10-15 个工作日", stay: "90 天内 180 天", docs: ["护照 + 旧护照", "申根申请表", "在职/在校证明", "银行流水（余额 5 万+）", "机票 + 全程酒店订单", "旅行保险（3 万欧以上）"], note: "申根区通用；首次申请需录指纹（全国 15 个城市签证中心）。" },
      { id: "id", country: "印尼（巴厘岛）", flag: "🇮🇩", type: "落地签/免签", level: "easy", fee: "落地签约 ¥200", duration: "落地办理", stay: "30 天（可延 1 次）", docs: ["护照（6 个月以上有效期）", "返程机票", "酒店预订单（抽查）"], note: "中国护照可免签入境 30 天（2024 年新政），也可落地签。" },
      { id: "ch", country: "瑞士", flag: "🇨🇭", type: "申根签证", level: "hard", fee: "约 ¥800-1200", duration: "10-15 个工作日", stay: "90 天内 180 天", docs: ["护照 + 旧护照", "申根申请表", "在职证明", "银行流水（余额 5 万+）", "机票 + 酒店订单", "旅行保险（3 万欧以上）"], note: "申根区通用；瑞士签证中心需提前预约。" },
      { id: "th", country: "泰国", flag: "🇹🇭", type: "免签", level: "easy", fee: "免费", duration: "无需办理", stay: "60 天（可延 30 天）", docs: ["护照（6 个月以上有效期）", "返程机票（抽查）"], note: "2024 年 3 月起中泰互免签证，直接持护照入境。" },
      { id: "cn", country: "中国（国内游）", flag: "🇨🇳", type: "无需签证", level: "easy", fee: "免费", duration: "无需办理", stay: "-", docs: ["身份证", "部分边境地区需边防证（如珠峰大本营）"], note: "新疆、西藏部分区域需边防证，可出发前在户籍地办理。" }
    ];

    const LEVEL_META = {
      easy: { label: "简单", color: "var(--chart-5)" },
      medium: { label: "中等", color: "var(--chart-3)" },
      hard: { label: "较复杂", color: "var(--chart-2)" }
    };

    function Topbar() {
      const [theme, setThemeState] = useState(() => (document.documentElement.classList.contains("dark") ? "dark" : "light"));
      const toggleTheme = () => setThemeState(window.TravelMate.utils.toggleTheme());
      return (
        <header className="topbar">
          <div className="topbar-left">
            <a className="brand" href="home.html">
              <div className="brand-icon"><SparkleIcon size={18} /></div>
              <span className="brand-text">TravelMate</span>
            </a>
            <a className="back-link" href="home.html"><ArrowLeftIcon size={14} /> 返回首页</a>
          </div>
          <div className="topbar-right">
            <button className="icon-btn" title="切换主题" onClick={toggleTheme} aria-label="切换主题">
              {theme === "dark" ? <SunIcon size={18} /> : <MoonIcon size={18} />}
            </button>
            <div className="avatar">旅</div>
          </div>
        </header>
      );
    }

    function PageHead() {
      return (
        <div className="page-head">
          <h1>签证查询</h1>
          <p>按国家查询签证类型、材料与办理须知 · 数据更新于 2026-07，出行前请以官方为准</p>
        </div>
      );
    }

    function VisaCard({ item }) {
      const [open, setOpen] = useState(false);
      const lv = LEVEL_META[item.level];
      return (
        <div className={`visa-card ${open ? "open" : ""}`}>
          <button className="visa-card-head" onClick={() => setOpen(!open)} aria-expanded={open}>
            <span className="visa-flag">{item.flag}</span>
            <div className="visa-main">
              <strong>{item.country}</strong>
              <span className="visa-type">{item.type}</span>
            </div>
            <span className="visa-level" style={{ background: lv.color + "1a", color: lv.color }}>{lv.label}</span>
            <span className="visa-chevron">▾</span>
          </button>
          {open && (
            <div className="visa-detail">
              <div className="visa-meta-grid">
                <div className="visa-meta"><span className="meta-label"><WalletIcon size={12} /> 费用</span><strong>{item.fee}</strong></div>
                <div className="visa-meta"><span className="meta-label"><ClockIcon size={12} /> 办理时长</span><strong>{item.duration}</strong></div>
                <div className="visa-meta"><span className="meta-label"><CalendarIcon size={12} /> 停留期限</span><strong>{item.stay}</strong></div>
              </div>
              <div className="visa-docs">
                <h4><FileCheckIcon size={14} /> 所需材料</h4>
                <ul>
                  {item.docs.map((d, i) => <li key={i}><CheckIcon size={12} /> {d}</li>)}
                </ul>
              </div>
              <div className="visa-note">
                <AlertIcon size={14} />
                <p>{item.note}</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [query, setQuery] = useState("");
      const [openId, setOpenId] = useState("jp");

      useEffect(() => {
        window.TravelMate.utils.initTheme();
      }, []);

      const filtered = useMemo(() => {
        if (!query.trim()) return VISA_DATA;
        const q = query.trim().toLowerCase();
        return VISA_DATA.filter((v) => v.country.toLowerCase().includes(q) || v.type.toLowerCase().includes(q));
      }, [query]);

      const toggle = (id) => setOpenId((prev) => (prev === id ? null : id));

      return (
        <div className="app">
          <Topbar />
          <PageHead />
          <div className="visa-body">
            <div className="search-box">
              <SearchIcon size={18} />
              <input placeholder="搜索国家，如：日本 / 冰岛 / 泰国..." value={query} onChange={(e) => setQuery(e.target.value)} />
            </div>
            <div className="visa-legend">
              <span className="legend-item"><span className="legend-dot" style={{ background: "var(--chart-5)" }}></span>简单</span>
              <span className="legend-item"><span className="legend-dot" style={{ background: "var(--chart-3)" }}></span>中等</span>
              <span className="legend-item"><span className="legend-dot" style={{ background: "var(--chart-2)" }}></span>较复杂</span>
            </div>
            {filtered.length === 0 ? (
              <div className="empty-result">
                <PassportIcon size={26} />
                <h3>没有找到相关国家</h3>
                <p>换个关键词试试，或咨询 AI 助手</p>
              </div>
            ) : (
              <div className="visa-list">
                {filtered.map((v) => (
                  <VisaCard key={v.id} item={v} open={openId === v.id} />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);letter-spacing:var(--tracking-normal);line-height:1.55}
    button,input{font:inherit}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:100;height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--spacing)*4);padding:0 calc(var(--spacing)*8);background:var(--background);backdrop-filter:blur(8px)}
    .brand-icon{width:36px;height:36px;border-radius:calc(var(--radius) + 4px);display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground);font-weight:700}
    .brand-text{font-size:1.1rem;font-weight:700;letter-spacing:-0.01em}
    .back-link{display:inline-flex;align-items:center;gap:.35rem;color:var(--muted-foreground);text-decoration:none;font-size:.86rem;transition:color .2s}
    .back-link:hover{color:var(--primary)}

    /* Page Head */
    .page-head{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*7) calc(var(--spacing)*8) calc(var(--spacing)*4);display:flex;flex-direction:column;gap:calc(var(--spacing)*2)}
    .page-head h1{font-size:1.9rem;font-weight:700;letter-spacing:-0.02em}
    .page-head p{color:var(--muted-foreground);font-size:.88rem}

    /* Body */
    .visa-body{max-width:820px;margin:0 auto;padding:0 calc(var(--spacing)*8) calc(var(--spacing)*10);display:flex;flex-direction:column;gap:calc(var(--spacing)*4)}

    /* Search */
    .search-box{display:flex;align-items:center;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*2.5) calc(var(--spacing)*4);border:1px solid var(--input);border-radius:999px;background:var(--card);transition:border-color .2s,box-shadow .2s}
    .search-box:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px rgba(66,133,244,.12)}
    .search-box svg{color:var(--muted-foreground);flex:0 0 auto}
    .search-box input{flex:1;border:none;outline:none;background:transparent;color:var(--foreground);font-size:.9rem}
    .search-box input::placeholder{color:var(--muted-foreground)}

    /* Legend */
    .visa-legend{display:flex;gap:calc(var(--spacing)*4);font-size:.78rem;color:var(--muted-foreground)}
    .legend-item{display:inline-flex;align-items:center;gap:.4rem}
    .legend-dot{width:8px;height:8px;border-radius:50%}

    /* List */
    .visa-list{display:flex;flex-direction:column;gap:calc(var(--spacing)*2.5)}
    .visa-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden;transition:border-color .2s}
    .visa-card.open{border-color:var(--ring)}
    .visa-card-head{width:100%;display:flex;align-items:center;gap:calc(var(--spacing)*3.5);padding:calc(var(--spacing)*3.5) calc(var(--spacing)*4);border:none;background:transparent;color:var(--foreground);cursor:pointer;text-align:left}
    .visa-card-head:hover{background:var(--popover)}
    .visa-flag{font-size:1.6rem;line-height:1}
    .visa-main{flex:1;min-width:0}
    .visa-main strong{display:block;font-size:.98rem;margin-bottom:.15rem}
    .visa-type{font-size:.76rem;color:var(--muted-foreground)}
    .visa-level{flex:0 0 auto;padding:.28rem .7rem;border-radius:999px;font-size:.74rem;font-weight:600}
    .visa-chevron{flex:0 0 auto;color:var(--muted-foreground);transition:transform .2s}
    .visa-card.open .visa-chevron{transform:rotate(180deg)}

    /* Detail */
    .visa-detail{display:flex;flex-direction:column;gap:calc(var(--spacing)*4);padding:0 calc(var(--spacing)*4) calc(var(--spacing)*4);border-top:1px solid var(--border);padding-top:calc(var(--spacing)*3.5)}
    .visa-meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--spacing)*3)}
    .visa-meta{display:flex;flex-direction:column;gap:.3rem;padding:calc(var(--spacing)*2.5);border:1px solid var(--border);border-radius:var(--radius);background:var(--popover)}
    .meta-label{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--muted-foreground)}
    .visa-meta strong{font-size:.84rem}
    .visa-docs h4{display:flex;align-items:center;gap:.4rem;font-size:.9rem;font-weight:700;margin-bottom:calc(var(--spacing)*2)}
    .visa-docs ul{list-style:none;display:flex;flex-direction:column;gap:calc(var(--spacing)*1.5)}
    .visa-docs li{display:flex;align-items:center;gap:.5rem;font-size:.84rem;color:var(--muted-foreground);line-height:1.5}
    .visa-docs li svg{color:var(--chart-5);flex:0 0 auto}
    .visa-note{display:flex;gap:.6rem;padding:calc(var(--spacing)*3);border-radius:var(--radius);background:var(--muted);font-size:.8rem;color:var(--muted-foreground);line-height:1.6}
    .visa-note svg{flex:0 0 auto;color:var(--primary);margin-top:.1rem}

    /* Empty */
    .empty-result{display:flex;flex-direction:column;align-items:center;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*9) calc(var(--spacing)*4);text-align:center;border:1px dashed var(--border);border-radius:calc(var(--radius) + 4px);color:var(--muted-foreground)}
    .empty-result h3{font-size:1.05rem;font-weight:700;color:var(--foreground)}
    .empty-result p{font-size:.85rem}

    /* Responsive */
    @media (max-width:1024px){
      .visa-body{padding-left:calc(var(--spacing)*5);padding-right:calc(var(--spacing)*5)}
    }
    @media (max-width:768px){
      .topbar{padding:0 calc(var(--spacing)*4)}
      .back-link{display:none}
      .page-head{padding:calc(var(--spacing)*6) calc(var(--spacing)*4) calc(var(--spacing)*3)}
      .visa-body{padding:0 calc(var(--spacing)*4) calc(var(--spacing)*8)}
      .visa-meta-grid{grid-template-columns:1fr}
      .visa-card-head{gap:calc(var(--spacing)*2.5)}
      .visa-flag{font-size:1.3rem}
    }
  </style>
</body>
</html>
